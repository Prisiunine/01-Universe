<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>捡到一部 iPhone</title>
<link rel="preload" as="image" href="https://s41.ax1x.com/2026/10/25/pnDLo5D.jpg" fetchpriority="high">
<link rel="preload" as="image" href="https://s41.ax1x.com/2026/10/29/pnyWIWq.jpg" fetchpriority="high">
<link rel="preload" as="image" href="https://s41.ax1x.com/2026/10/29/pnyW5Yn.jpg" fetchpriority="high">
<style>
/* ========== 基础 ========== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  display:grid;place-items:center;
  background:radial-gradient(circle at 50% 0%,#2c2c38 0%,#0d0d11 45%,#050507 100%);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Apple SD Gothic Neo",sans-serif;
  user-select:none;
}

/* ========== 手机外壳 ========== */
.phone{
  position:relative;width:390px;height:844px;padding:11px;flex:none;
  border-radius:56px;
  background:linear-gradient(150deg,#9a9aa2 0%,#3c3c42 12%,#1a1a1e 40%,#1a1a1e 60%,#3c3c42 88%,#9a9aa2 100%);
  box-shadow:0 40px 90px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.06);
  transform:scale(var(--s,1));transform-origin:center center;
}
.screen{
  position:relative;width:100%;height:100%;border-radius:46px;
  overflow:hidden;background:#000;isolation:isolate;
}

/* ========== 灵动岛 ========== */
.island{
  position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:122px;height:35px;background:#000;border-radius:20px;z-index:120;
}

/* ========== 状态栏 ========== */
.status-bar{
  position:absolute;top:0;left:0;right:0;height:56px;z-index:110;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 26px 0 32px;
  color:#fff;font-size:15px;font-weight:600;letter-spacing:.2px;
  pointer-events:none;transition:color .25s;
}
.status-bar.dark{color:#000}
.sb-time{padding-top:2px}
.sb-icons{display:flex;align-items:center;gap:6px;padding-top:2px}
.sb-icons svg{display:block}

/* ========== Home 指示条 ========== */
.home-ind{
  position:absolute;left:0;right:0;bottom:0;height:34px;z-index:200;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
.home-ind i{
  display:block;width:134px;height:5px;border-radius:3px;
  background:#fff;mix-blend-mode:difference;
  transition:opacity .2s,transform .2s;
}
.home-ind.dim i{opacity:.55}

/* ========== 通用页面 ========== */
.page{position:absolute;inset:0}

/* ========== 锁屏 ========== */
#lockPage{
  z-index:40;
  transition:opacity .5s ease,transform .5s ease;
  will-change:opacity,transform;
  backface-visibility:hidden;
}
#lockPage.gone{opacity:0;transform:scale(1.12);pointer-events:none}
.lock-wall{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  display:block;
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
  transform:translateZ(0) scale(1.002);
  will-change:transform;
  backface-visibility:hidden;
}
.lock-wrap{
  position: relative; z-index: 2;
  display: flex; flex-direction: column; align-items: center;
  padding: 76px 24px 26px; color: #fff;
  height: 40%; /* 固定在上半部分 */
}
/* 动态类名，用于滑动弹出 */
#lockKeypadContainer.show {
  transform: translateY(0) !important;
}
.lock-lockicon{opacity:.85;margin-bottom:12px}
.lock-date{font-size:15px;font-weight:600;letter-spacing:.3px;opacity:.95}
.lock-clock{
  font-size:82px;font-weight:300;letter-spacing:-3.5px;line-height:1.02;
  margin-top:2px;font-variant-numeric:tabular-nums;
}
.lock-spacer{flex:1}
.pin-dots{display:flex;gap:22px;margin-bottom:26px;transition:transform .1s}
.pin-dots span{
  width:13px;height:13px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.9);transition:background .14s,transform .14s;
}
.pin-dots span.on{background:#fff;transform:scale(1.06)}
.pin-dots.shake{animation:shake .46s}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  14%{transform:translateX(-13px)}
  28%{transform:translateX(12px)}
  42%{transform:translateX(-9px)}
  58%{transform:translateX(7px)}
  76%{transform:translateX(-4px)}
}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center}
.key{
  width:72px;height:72px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(255,255,255,.17);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  color:#fff;font-size:31px;font-weight:400;font-family:inherit;
  display:flex;align-items:center;justify-content:center;
  transition:background .1s,transform .08s;
}
.key:active{background:rgba(255,255,255,.48);transform:scale(.92)}
.key.blank{background:transparent;pointer-events:none}
.key.del{background:transparent;font-size:23px}
.key.del:active{background:rgba(255,255,255,.22)}
.lock-hint{margin-top:20px;font-size:11.5px;letter-spacing:2px;opacity:.6}
.lock-btn-row{display:flex;justify-content:space-between;width:100%;padding:0 24px;margin-top:auto;margin-bottom:24px;font-size:14px;opacity:.9}

/* ========== 主屏 ========== */
#homePage{z-index:10;transition:transform .42s cubic-bezier(.3,.75,.25,1),opacity .34s,filter .34s}
#homePage.zoomed{transform:scale(.9);opacity:.3;filter:blur(3px)}
.home-wall{
  position:absolute;inset:0;
  background:linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.4)), url(https://s41.ax1x.com/2026/10/25/pnDL7Pe.jpg) center/cover no-repeat;
}
.home-inner{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:64px 14px 0}

/* --- 小组件样式 --- */
.widgets-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 20px;
}
.widget {
  border-radius: 22px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: transform .15s ease, filter .15s;
  box-shadow: 0 4px 14px rgba(0,0,0,.18);
  height: 158px;
}
.widget:active {
  transform: scale(.95);
  filter: brightness(.9);
}
/* 日历组件 */
.widget-cal {
  background: #ffffff;
  color: #000;
}
.wc-day { font-size: 13px; font-weight: 700; color: #FF3B30; line-height: 1.2; }
.wc-date { font-size: 42px; font-weight: 300; line-height: 1; margin-top: 2px; margin-bottom: 8px; letter-spacing: -1px;}
.wc-events { display: flex; flex-direction: column; gap: 6px; }
.wc-event { display: flex; gap: 6px; align-items: stretch; }
.wc-bar { width: 3px; background: #B08BBB; border-radius: 2px; flex: none; }
.wc-ev-content { display: flex; flex-direction: column; justify-content: center; }
.wc-ev-title { font-size: 11px; font-weight: 600; color: #111; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 110px;}
.wc-ev-time { font-size: 10px; color: #8e8e93; margin-top: 1px; }

/* 天气组件 */
.widget-weather {
  background: linear-gradient(180deg, #3FA4FF, #157DEC);
  color: #fff;
}
.ww-icon { position: absolute; top: 12px; right: 14px; }
.ww-city { font-size: 14px; font-weight: 600; margin-top: 2px; letter-spacing: .5px; display:flex; align-items:center; gap:2px;}
.ww-temp { font-size: 38px; font-weight: 300; line-height: 1; margin-top: 4px; letter-spacing: -1px;}
.ww-desc { font-size: 11px; font-weight: 600; margin-top: auto; opacity: .95; }
.ww-range { font-size: 11px; font-weight: 500; opacity: .85; margin-top: 2px; }


/* --- 应用网格 --- */
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 4px}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}
.app-icon{
  width:59px;height:59px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.32);
  transition:transform .13s ease,filter .13s;position:relative;
}
.app:active .app-icon{transform:scale(.87);filter:brightness(.88)}
.app-label{
  font-size:11px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5);
  white-space:nowrap;max-width:76px;overflow:hidden;text-overflow:ellipsis;
}
.dock{
  margin-top:auto;margin-bottom:26px;height:92px;flex:none;
  background:rgba(255,255,255,.18);backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  border-radius:34px;display:flex;align-items:center;justify-content:space-around;padding:0 12px;
}
.dock .app-label{display:none}

/* ========== 应用页 ========== */
#appPage{
  z-index:20;display:flex;flex-direction:column;background:#fff;
  transform-origin:center center;
  transition:transform .45s cubic-bezier(0.32, 0.72, 0, 1),opacity .45s ease,border-radius .45s ease;
  will-change:transform,opacity;border-radius:0;
  overflow: hidden; /* 👈 新增：强制内部元素也被圆角裁切 */
  transform: translateZ(0); /* 👈 新增：修复部分浏览器缩放时圆角失效的问题 */
}
#appPage.hidden{display:none;pointer-events:none}

.app-nav{
  flex:none;height:100px;padding:56px 8px 6px;
  display:flex;align-items:center;position:relative;
  background:rgba(249,249,249,.94);
  backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  border-bottom:.5px solid rgba(0,0,0,.16);z-index:5;
}
.app-nav.dark{background:rgba(28,28,30,.92);border-bottom-color:rgba(255,255,255,.14);color:#fff}
.app-nav.hidden{display:none}
.nav-back{
  display:flex;align-items:center;gap:3px;height:38px;padding:0 6px;
  border:none;background:none;cursor:pointer;font-family:inherit;
  color:#007AFF;font-size:16px;font-weight:400;z-index:2;
}
.app-nav.dark .nav-back{color:#0A84FF}
.nav-back:active{opacity:.45}
.nav-title{
  position:absolute;left:80px;right:80px;top:56px;height:38px;
  display:flex;align-items:center;justify-content:center;
  font-size:16.5px;font-weight:600;pointer-events:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:14px;padding-right:8px;color:#007AFF;font-size:16px}
.app-nav.dark .nav-right{color:#0A84FF}
.nav-right svg{cursor:pointer}
.float-back{
  position:absolute;top:62px;left:14px;width:38px;height:38px;border-radius:50%;
  border:none;background:rgba(0,0,0,.28);backdrop-filter:blur(10px);
  color:#fff;font-size:22px;line-height:1;cursor:pointer;z-index:30;
  display:flex;align-items:center;justify-content:center;
}
.float-back:active{background:rgba(0,0,0,.5)}

.app-content{
  flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;position:relative;
}
.app-content::-webkit-scrollbar{width:0;height:0}
.app-footer{flex:none;z-index:5}

/* ========== 通用小组件 ========== */
.tabbar{
  height:84px;padding:10px 0 22px;
  display:flex;align-items:flex-start;justify-content:space-around;
  background:rgba(249,249,249,.94);backdrop-filter:saturate(180%) blur(22px);
  -webkit-backdrop-filter:saturate(180%) blur(22px);
  border-top:.5px solid rgba(0,0,0,.14);
}
.tabbar.dark{background:rgba(20,20,22,.94);border-top-color:rgba(255,255,255,.12)}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#8e8e93;cursor:pointer;width:60px}
.tab-item.on{color:#007AFF}
.tabbar.dark .tab-item{color:#8e8e93}
.tabbar.dark .tab-item.on{color:#fff}
.tab-item svg{display:block}

.search-bar{
  margin:10px 16px 12px;height:38px;border-radius:11px;background:rgba(118,118,128,.12);
  display:flex;align-items:center;gap:7px;padding:0 10px;color:#8e8e93;font-size:15px;
}

/* ========== KakaoTalk 首页 (图3样式) ========== */
.kkt-chat-item {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  background: #fff;
  cursor: pointer;
  gap: 14px;
}
.kkt-chat-item:active { background: #f2f2f4; }
.kkt-chat-av {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 20px;
  font-weight: 600;
  flex: none;
}
.kkt-chat-main {
  flex: 1;
  min-width: 0;
}
.kkt-chat-name {
  font-size: 16px;
  font-weight: 600;
  color: #000;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.kkt-chat-msg {
  font-size: 14px;
  color: #8e8e93;
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.kkt-chat-date {
  font-size: 12px;
  color: #8e8e93;
  align-self: flex-start;
  margin-top: 4px;
  flex: none;
}
.kkt-bottom-tab {
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 10px 0 28px;
  border-top: 1px solid #f2f2f4;
  background: #fff;
}
.kkt-tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: #b0b0b5;
  font-size: 11px;
  cursor: pointer;
}
.kkt-tab-item.active { color: #000; }

/* ========== 图片/照片 ========== */
.ph-head{display:flex;align-items:baseline;justify-content:space-between;padding:12px 16px 8px}
.ph-title{font-size:22px;font-weight:700;color:#111}
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:0 2px}
.ph-cell{
  aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
  font-size:30px;cursor:pointer;position:relative;overflow:hidden;
}
.ph-cell:active{filter:brightness(.9)}

/* ========== 邮件 ========== */
.mail-head{padding:8px 16px 4px;font-size:32px;font-weight:700;color:#111}
.mail-item{display:flex;gap:11px;padding:12px 16px;border-bottom:.5px solid #efeff1;cursor:pointer}
.mail-item:active{background:#f6f6f8}
.mail-dot{width:9px;height:9px;border-radius:50%;background:#007AFF;flex:none;margin-top:6px;opacity:0}
.mail-item.unread .mail-dot{opacity:1}
.mail-body{flex:1;min-width:0}
.mail-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mail-from{font-size:15px;font-weight:600;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail-date{font-size:11.5px;color:#9a9aa0;flex:none}
.mail-sub{font-size:13.5px;color:#3a3a3c;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail-snip{font-size:12.5px;color:#9a9aa0;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ========== 日历 ========== */
.cal-top{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 6px}
.cal-month{font-size:21px;font-weight:700;color:#111}
.cal-month span{color:#FF3B30}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);padding:10px 10px 5px;text-align:center;font-size:11.5px;color:#8e8e93;font-weight:500}
.cal-week span:first-child{color:#FF3B30}
.cal-week span:last-child{color:#007AFF}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:0 10px;gap:3px 0}
.cal-cell{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:15px;color:#111;border-radius:50%}
.cal-cell.empty{visibility:hidden}
.cal-cell.dim{color:#c7c7cc}
.cal-cell.today{background:#FF3B30;color:#fff;font-weight:600}
.cal-sec{padding:16px 20px 6px;font-size:13px;font-weight:600;color:#8e8e93;letter-spacing:.4px}
.cal-event{display:flex;gap:11px;padding:9px 20px;align-items:flex-start}
.cal-bar{width:3px;border-radius:2px;background:#FF3B30;align-self:stretch;min-height:30px}
.cal-ev-title{font-size:14.5px;color:#111;font-weight:500}
.cal-ev-time{font-size:12.5px;color:#8e8e93;margin-top:2px}

/* ========== 时钟 ========== */
.clock-page{background:#000;min-height:100%;padding:10px 0 30px;color:#fff}
.clock-nav{padding:8px 20px;font-size:32px;font-weight:700;color:#fff}
.analog{
  position:relative;width:224px;height:224px;margin:6px auto 0;border-radius:50%;
  background:#fff;box-shadow:0 0 0 5px #1c1c1e,0 12px 40px rgba(0,0,0,.7);
}
.analog svg{position:absolute;inset:0;width:100%;height:100%}
.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:4px;background:#111}
.hand.h{width:6px;height:56px;margin-left:-3px}
.hand.m{width:4px;height:80px;margin-left:-2px}
.hand.s{width:2px;height:90px;margin-left:-1px;background:#FF3B30;transition:transform .13s cubic-bezier(.4,2.4,.6,1)}
.clock-pin{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#FF3B30;box-shadow:0 0 0 3px #fff}
.digital-time{text-align:center;font-size:36px;font-weight:200;letter-spacing:1px;margin-top:24px;font-variant-numeric:tabular-nums}
.world{margin:22px 16px 0;background:#1c1c1e;border-radius:14px;overflow:hidden}
.world-row{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:.5px solid #2c2c2e;font-size:15px}
.world-row:last-child{border:none}
.world-row .wl{color:#d1d1d6}
.world-row .wr{color:#8e8e93;font-size:13px}

/* ========== 备忘录 ========== */
.note-head{padding:10px 18px 6px;font-size:32px;font-weight:700;color:#111}
.note-item{padding:12px 18px;border-bottom:.5px solid #efeff1;cursor:pointer}
.note-item:active{background:#f7f7f9}
.note-title{font-size:15px;font-weight:600;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-snip{font-size:13px;color:#9a9aa0;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-date{font-size:11.5px;color:#b4b4b9;margin-top:4px}
.note-body{padding:16px 20px 50px;font-size:16px;line-height:1.72;color:#111;white-space:pre-wrap}

/* ========== 天气 ========== */
.wx{min-height:100%;background:linear-gradient(180deg,#4a90d9 0%,#2f6fb5 45%,#255a95 100%);color:#fff;padding-bottom:26px}
.wx-head{text-align:center;padding:18px 0 4px}
.wx-city{font-size:23px;font-weight:500;letter-spacing:.3px}
.wx-temp{font-size:84px;font-weight:200;line-height:1.06;letter-spacing:-3px}
.wx-desc{font-size:15px;opacity:.92}
.wx-range{font-size:14px;opacity:.8;margin-top:2px}
.wx-hourly{margin:22px 14px 0;background:rgba(255,255,255,.16);border-radius:16px;padding:12px 8px;backdrop-filter:blur(8px)}
.wx-hourly-title{font-size:11px;letter-spacing:.6px;opacity:.75;padding:0 8px 8px}
.wx-hours{display:flex;overflow-x:auto;gap:2px}
.wx-hours::-webkit-scrollbar{display:none}
.wx-hour{flex:none;width:60px;text-align:center;font-size:12px}
.wx-hour .hi{font-size:22px;margin:8px 0}
.wx-hour .ht{font-size:16px;font-weight:500}
.wx-daily{margin:14px 14px 0;background:rgba(255,255,255,.16);border-radius:16px;padding:6px 14px;backdrop-filter:blur(8px)}
.wx-day{display:flex;align-items:center;padding:11px 0;border-bottom:.5px solid rgba(255,255,255,.16);font-size:15px}
.wx-day:last-child{border:none}
.wx-day .dn{width:52px;font-weight:500}
.wx-day .di{width:36px;font-size:20px;text-align:center}
.wx-day .dr{flex:1;text-align:right;color:rgba(255,255,255,.82);font-variant-numeric:tabular-nums}

/* ========== 设置 ========== */
.set-search{margin:8px 16px 4px;height:36px;border-radius:10px;background:rgba(118,118,128,.12);display:flex;align-items:center;gap:7px;padding:0 10px;color:#8e8e93;font-size:15px}
.set-account{display:flex;align-items:center;gap:13px;padding:14px 16px;background:#fff;cursor:pointer}
.set-avatar{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#8E8E93,#48484A);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:600}
.set-acc-name{font-size:17px;color:#111;font-weight:500}
.set-acc-sub{font-size:12.5px;color:#8e8e93;margin-top:2px}
.set-group{margin:18px 16px 0;background:#fff;border-radius:12px;overflow:hidden}
.set-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:.5px solid #ececee;font-size:16px;color:#111;cursor:pointer}
.set-row:last-child{border:none}
.set-row:active{background:#f2f2f4}
.set-ico{width:29px;height:29px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;color:#fff}
.set-title{flex:1}
.set-val{color:#8e8e93;font-size:15px}
.chev{color:#c4c4c8;font-size:17px;font-weight:400}
.switch{width:51px;height:31px;border-radius:16px;background:#e5e5ea;position:relative;transition:background .2s;flex:none;cursor:pointer}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.28);transition:transform .2s}
.switch.on{background:#34C759}
.switch.on::after{transform:translateX(20px)}

/* ========== 地图 ========== */
.map-wrap{position:relative;height:100%;min-height:620px;background:#e9f0e4;overflow:hidden}
.map-wrap::before{
  content:'';position:absolute;inset:0;
  background:
    linear-gradient(90deg,transparent 47%,#fff 47%,#fff 53%,transparent 53%),
    linear-gradient(0deg,transparent 28%,#fff 28%,#fff 31%,transparent 31%),
    linear-gradient(0deg,transparent 72%,#fff 72%,#fff 74.5%,transparent 74.5%),
    linear-gradient(90deg,transparent 18%,#f7f7f0 18%,#f7f7f0 25%,transparent 25%),
    linear-gradient(58deg,transparent 60%,#cfe6c4 60%,#cfe6c4 79%,transparent 79%),
    linear-gradient(150deg,transparent 64%,#bcd9f5 64%,#bcd9f5 82%,transparent 82%);
}
.map-pin{position:absolute;left:50%;top:42%;transform:translate(-50%,-100%);font-size:38px;filter:drop-shadow(0 5px 7px rgba(0,0,0,.28))}
.map-me{position:absolute;left:50%;top:50%;width:17px;height:17px;margin:-8.5px 0 0 -8.5px;border-radius:50%;background:#007AFF;border:3px solid #fff;box-shadow:0 0 0 9px rgba(0,122,255,.18)}
.map-card{position:absolute;left:12px;right:12px;bottom:18px;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.map-card h4{font-size:15.5px;color:#111;margin-bottom:4px}
.map-card p{font-size:12.5px;color:#8e8e93}

/* ========== 电话 ========== */
.dial-display{height:70px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:300;color:#111;letter-spacing:1px;font-variant-numeric:tabular-nums}
.dial-grid{display:grid;grid-template-columns:repeat(3,74px);gap:14px;justify-content:center;padding:6px 0 16px}
.dial-btn{
  width:74px;height:74px;border-radius:50%;border:none;background:#f2f2f7;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:inherit;
  color:#111;font-size:28px;font-weight:400;transition:background .1s,transform .08s;
}
.dial-btn small{font-size:9px;letter-spacing:1.6px;color:#8e8e93;margin-top:-1px;height:11px}
.dial-btn:active{background:#dcdce2;transform:scale(.94)}
.dial-call{width:74px;height:74px;border-radius:50%;background:#34C759;border:none;color:#fff;font-size:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
.dial-call:active{filter:brightness(.88)}
.rec-item{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:.5px solid #efeff1;font-size:15px;color:#111}
.rec-name{flex:1}
.rec-time{font-size:12px;color:#9a9aa0}

/* ========== 浏览器 ========== */
.saf-addr{margin:8px 14px 12px;height:40px;border-radius:12px;background:rgba(118,118,128,.12);display:flex;align-items:center;justify-content:center;gap:6px;color:#8e8e93;font-size:15px}
.saf-sec{padding:6px 18px 8px;font-size:12.5px;font-weight:600;color:#8e8e93;letter-spacing:.3px}
.saf-fav{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px;padding:4px 16px 18px}
.saf-f{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;color:#3a3a3c;cursor:pointer}
.saf-f .fi{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#f2f2f7}
.saf-f:active .fi{filter:brightness(.92)}

/* ========== 音乐 ========== */
.mu{min-height:100%;background:linear-gradient(180deg,#3a2a4d 0%,#241a33 55%,#12101a 100%);color:#fff;padding:16px 26px 30px;text-align:center}
.mu-art{width:228px;height:228px;margin:14px auto 0;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:70px;box-shadow:0 20px 44px rgba(0,0,0,.55)}
.mu-title{font-size:20px;font-weight:600;margin-top:26px}
.mu-artist{font-size:15px;color:#b0a8c0;margin-top:4px}
.mu-bar{height:5px;border-radius:3px;background:rgba(255,255,255,.22);margin:26px 0 8px;overflow:hidden}
.mu-bar>i{display:block;height:100%;width:36%;background:#fff;border-radius:3px}
.mu-times{display:flex;justify-content:space-between;font-size:11px;color:#9a90a8;font-variant-numeric:tabular-nums}
.mu-ctrl{display:flex;align-items:center;justify-content:center;gap:38px;margin-top:24px}
.mu-ctrl span{font-size:27px;cursor:pointer}
.mu-ctrl .play{font-size:42px}
.mu-next{margin-top:32px;text-align:left}
.mu-next-t{font-size:12.5px;color:#9a90a8;margin-bottom:8px}
.mu-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:.5px solid rgba(255,255,255,.1)}
.mu-thumb{width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.mu-item .n{font-size:14.5px}
.mu-item .a{font-size:12px;color:#9a90a8;margin-top:1px}

/* ========== 相机 ========== */
.cam{position:relative;min-height:100%;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cam::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 42% 34%,#3c4c6b,#0a0d15 72%)}
.cam-grid{position:absolute;inset:30px;background-image:linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px);background-size:33.33% 33.33%}
.cam-focus{position:absolute;left:50%;top:44%;width:74px;height:74px;margin:-37px 0 0 -37px;border:1.5px solid #FFD60A;border-radius:4px}
.cam-shutter{
  position:absolute;bottom:44px;left:50%;transform:translateX(-50%);
  width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.22);cursor:pointer;
}
.cam-shutter:active{background:rgba(255,255,255,.7)}
.cam-mode{position:absolute;bottom:124px;left:0;right:0;display:flex;justify-content:center;gap:22px;color:#fff;font-size:11.5px;letter-spacing:1px}
.cam-mode b{color:#FFD60A}


/* ========== 提示 toast ========== */
.toast{
  position:absolute;left:50%;bottom:64px;transform:translate(-50%,12px);
  background:rgba(30,30,34,.9);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:20px;
  z-index:190;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;
  backdrop-filter:blur(10px);white-space:nowrap;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ========== 呼叫面板 (Action Sheet) ========== */
#actionSheetContainer { position:absolute; inset:0; z-index:200; pointer-events:none; }
#actionSheetContainer > * { pointer-events:auto; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>

// 打开语言切换面板
function openLanguageSheet(){
  const container = $('#actionSheetContainer');
  const t = LOCALES[currentLang];
  
  container.innerHTML = `
    <div class="call-mask" onclick="closeLanguageSheet()" style="position:absolute; inset:0; background:rgba(0,0,0,0.4); display:flex; flex-direction:column; justify-content:flex-end; animation: fadeIn 0.2s ease; backdrop-filter: blur(4px);">

function closeLanguageSheet(){
  $('#actionSheetContainer').innerHTML = '';
}

// 设置语言并刷新 UI
function setLanguage(lang){
  currentLang = lang;
  closeLanguageSheet();
  
  // 更新字典
  const t = LOCALES[currentLang];
  
  // 1. 更新锁屏语言按钮、紧急、取消文字
  const langDisplay = document.getElementById('current-lang-display');
  if(langDisplay) langDisplay.textContent = t.langName;
  document.querySelector('.lock-btn-row span:first-child').textContent = t.emergency;
  document.querySelector('.lock-btn-row span:last-child').textContent = t.cancel;

  // 2. 刷新主屏幕（应用名称）
  renderHome();

  // 3. 刷新时间日期
  updateTime();

  // 4. 如果当前有打开的应用，重新渲染该应用
  if(appOpen && currentAppId){
    const app = APPS[currentAppId];
    viewStack[0] = app.root();
    renderView(viewStack[0]);
  }
  
  toast('Language set to ' + t.langName, 1500);
}

function fitPhone(){
  const s = Math.min(1, (window.innerHeight - 20) / 844, (window.innerWidth - 20) / 390);
  document.documentElement.style.setProperty('--s', s);
  window.SCALE = s;
}
window.addEventListener('resize', fitPhone);
fitPhone();

let toastTimer = null;
function toast(msg, ms = 2400){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), ms);
}

/* =========================================================
   框架
========================================================= */
let appOpen = false;
let currentAppId = null;
let viewStack = [];

const appPage = $('#appPage');
const appNav = $('#appNav');
const appContent = $('#appContent');
const appFooter = $('#appFooter');
const homePage = $('#homePage');
const statusBar = $('#statusBar');
const screenEl = $('#screen');

function openApp(id){
  currentAppId = id;
  const app = APPS[id];
  viewStack = [app.root()];
  appOpen = true;
  renderView(viewStack[0]);

  const appPage = $('#appPage');
  const homePage = $('#homePage');
  const iconEl = document.getElementById(`app-icon-${id}`);

  appPage.classList.remove('hidden');

  if (iconEl) {
    const iconRect = iconEl.getBoundingClientRect();
    const screenRect = screenEl.getBoundingClientRect();
    
    const iconCenterX = iconRect.left + iconRect.width / 2;
    const iconCenterY = iconRect.top + iconRect.height / 2;
    const screenCenterX = screenRect.left + screenRect.width / 2;
    const screenCenterY = screenRect.top + screenRect.height / 2;
    
    const dx = iconCenterX - screenCenterX;
    const dy = iconCenterY - screenCenterY;
    const scale = iconRect.width / screenRect.width; 
    
    // 初始状态：从图标位置开始
    appPage.style.transition = 'none';
    appPage.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
    appPage.style.opacity = '0';
    appPage.style.borderRadius = '14px'; // 👈 设置初始圆角为 14px（和图标一样）
    
    appPage.offsetHeight; // 强制重绘
    
    // 开始放大
    appPage.style.transition = 'transform 0.45s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.35s ease, border-radius 0.45s ease';
    appPage.style.transform = 'translate(0px, 0px) scale(1)';
    appPage.style.opacity = '1';
    appPage.style.borderRadius = '0';

    homePage.style.transition = 'transform 0.45s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.35s ease, filter 0.35s ease';
    homePage.style.transform = 'scale(0.9)';
    homePage.style.opacity = '0.3';
    homePage.style.filter = 'blur(3px)';
    homePage.classList.add('zoomed');
  } else {
    homePage.classList.add('zoomed');
  }
}

function pushView(view){
  viewStack.push(view);
  renderView(view);
}

function popView(){
  if(viewStack.length > 1){
    viewStack.pop();
    renderView(viewStack[viewStack.length - 1]);
  }
}

function onBack(){
  closeCallSheet(); // 返回时关闭呼叫面板
  if(viewStack.length > 1) popView();
  else closeApp();
}

function closeApp(){
  closeCallSheet();
  appOpen = false;

  // ⭐ 停止相机视频播放（退出相机后不再在后台出声）
  try {
    const camVideo = document.getElementById('cam-source-video');
    if (camVideo) {
      camVideo.onended = null;
      camVideo.pause();
      camVideo.removeAttribute('src');
      camVideo.load();
    }
  } catch (e) {}
  if (window.__camState) {
    if (window.__camState.rafId) {
      cancelAnimationFrame(window.__camState.rafId);
      window.__camState.rafId = null;
    }
    if (window.__camState.recordTimer) {
      clearInterval(window.__camState.recordTimer);
      window.__camState.recordTimer = null;
    }
    window.__camState.isRecording = false;
  }


  const appPage = $('#appPage');
  const homePage = $('#homePage');
  const iconEl = currentAppId ? document.getElementById(`app-icon-${currentAppId}`) : null;

  // 恢复过渡效果 (防止上滑手势后没有过渡)
  appPage.style.transition = 'transform 0.45s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.45s ease, border-radius 0.45s ease';
  homePage.style.transition = 'transform 0.45s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.45s ease, filter 0.45s ease';

  if (iconEl) {
    const iconRect = iconEl.getBoundingClientRect();
    const screenRect = screenEl.getBoundingClientRect();
    
    const iconCenterX = iconRect.left + iconRect.width / 2;
    const iconCenterY = iconRect.top + iconRect.height / 2;
    const screenCenterX = screenRect.left + screenRect.width / 2;
    const screenCenterY = screenRect.top + screenRect.height / 2;
    
    const dx = iconCenterX - screenCenterX;
    const dy = iconCenterY - screenCenterY;
    const scale = iconRect.width / screenRect.width; 
    
    // 飞回图标位置
    appPage.style.transformOrigin = 'center center';
    appPage.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
    appPage.style.opacity = '0';
    appPage.style.borderRadius = '14px'; // 👈 维持 14px 圆角
    
    // 桌面恢复
    homePage.style.transform = 'scale(1)';
    homePage.style.opacity = '1';
    homePage.style.filter = 'blur(0px)';
    homePage.classList.remove('zoomed');
  } else {
    homePage.classList.remove('zoomed');
  }

  statusBar.classList.remove('dark');

  // 动画结束后清理 DOM 和内联样式
  setTimeout(() => {
    if (!appOpen) {
      appPage.classList.add('hidden');
      appPage.style.transition = '';
      appPage.style.transform = '';
      appPage.style.opacity = '';
      appPage.style.transformOrigin = '';
      appPage.style.borderRadius = ''; // 👈 恢复默认
      
      homePage.style.transition = '';
      homePage.style.transform = '';
      homePage.style.opacity = '';
      homePage.style.filter = '';
      
      viewStack = [];
      currentAppId = null;
    }
  }, 460);
}

function renderView(v){
  const navStyle = v.nav || 'light';

  if(navStyle === 'none'){
    appNav.classList.add('hidden');
  }else{
    appNav.classList.remove('hidden');
    appNav.className = 'app-nav' + (navStyle === 'dark' ? ' dark' : '');
    const isRoot = viewStack.length === 1;
    appNav.innerHTML = `
      <button class="nav-back" onclick="onBack()">
        <svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>
        <span>${isRoot ? '主屏幕' : '返回'}</span>
      </button>
      <div class="nav-title">${v.title || ''}</div>
      <div class="nav-right">${v.right || ''}</div>`;
  }

  appContent.innerHTML = v.body || '';
  appContent.scrollTop = 0;
  appFooter.innerHTML = v.footer || '';
  appPage.style.background = v.bg || '#fff';

  statusBar.classList.toggle('dark', navStyle === 'light');
  if(navStyle === 'none' && v.statusLight !== false){
    statusBar.classList.remove('dark');
  }

  if(currentAppId === 'clock') tickClock();
  if(currentAppId === 'weather') updateWeatherUI();
}

function floatBack(){
  return `<button class="float-back" onclick="onBack()">‹</button>`;
}

/* =========================================================
   锁屏
========================================================= */
let pin = '';
function buildKeypad(){
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  $('#keypad').innerHTML = keys.map(k=>{
    if(k === '') return '<button class="key blank"></button>';
    if(k === '⌫') return '<button class="key del" data-k="del">⌫</button>';
    return `<button class="key" data-k="${k}">${k}</button>`;
  }).join('');

  $('#keypad').addEventListener('click', e=>{
    const btn = e.target.closest('.key');
    if(!btn || btn.classList.contains('blank')) return;
    const k = btn.dataset.k;
    if(k === 'del'){ pin = pin.slice(0, -1); updateDots(); return; }
    if(pin.length >= 4) return;
    pin += k;
    updateDots();
    if(pin.length === 4) checkPin();
  });
}

/* =========================================================
   锁屏滑动交互逻辑
========================================================= */
window.hideLockKeypad = function() {
  pin = '';
  if (typeof updateDots === 'function') updateDots();
  const container = document.getElementById('lockKeypadContainer');
  const hint = document.getElementById('lockSwipeHint');
  if (container) container.classList.remove('show');
  if (hint) hint.style.opacity = '1';
};

// 在全局初始化的地方绑定滑动事件
setTimeout(() => {
  const lockPageEl = document.getElementById('lockPage');
  const lockKeypadContainer = document.getElementById('lockKeypadContainer');
  const lockSwipeHint = document.getElementById('lockSwipeHint');
  
  if (!lockPageEl) return;

  let lockStartY = 0;
  let isLockDragging = false;

  lockPageEl.addEventListener('pointerdown', (e) => {
    // 如果按在密码面板上，不触发全屏滑动手势
    if (e.target.closest('#lockKeypadContainer')) return;
    
    lockStartY = e.clientY;
    isLockDragging = true;
  });

  lockPageEl.addEventListener('pointerup', (e) => {
    if (!isLockDragging) return;
    isLockDragging = false;
    
    const dy = e.clientY - lockStartY; // 向上滑动为负数
    const isShown = lockKeypadContainer.classList.contains('show');
    
    if (!isShown && dy < -30) {
      // 向上滑动：弹出键盘
      lockKeypadContainer.classList.add('show');
      lockSwipeHint.style.opacity = '0';
    } else if (isShown && dy > 40) {
      // 向下滑动：收起键盘（为了防止误触，仅当没有输入任何数字时才允许收起）
      if (pin.length === 0) {
        hideLockKeypad();
      }
    }
  });
}, 100);

function updateDots(){
  document.querySelectorAll('#pinDots span').forEach((s, i)=>{
    s.classList.toggle('on', i < pin.length);
  });
}
function checkPin(){
  setTimeout(()=>{
    if(pin === PASSWORD){
      $('#lockPage').classList.add('gone');
      statusBar.classList.remove('dark');
      setTimeout(()=>{ $('#lockPage').style.display = 'none'; }, 520);
    }else{
      const d = $('#pinDots');
      d.classList.add('shake');
      if(navigator.vibrate) navigator.vibrate(60);
      setTimeout(()=>{
        d.classList.remove('shake');
        pin = '';
        updateDots();
      }, 470);
    }
  }, 120);
}

// 全局函数：切换 KKT 内部 Tab
window.switchKktTab = function(tab) {
  window.kktCurrentTab = tab;
  const app = APPS['kkt'];
  viewStack[0] = app.root();
  renderView(viewStack[0]);
};

window.scrollChatToTop = function() {
  const appContent = document.getElementById('appContent');
  if (appContent) {
    appContent.scrollTo({ top: 0, behavior: 'smooth' });
  }
};

// 滚动时控制显示/隐藏
setTimeout(() => {
  const appContent = document.getElementById('appContent');
  if (!appContent) return;
  appContent.addEventListener('scroll', () => {
    const btn = appContent.querySelector('[onclick="scrollChatToTop()"]');
    if (btn) {
      btn.style.opacity = appContent.scrollTop > 100 ? '1' : '0';
      btn.style.pointerEvents = appContent.scrollTop > 100 ? 'auto' : 'none';
      btn.style.transition = 'opacity .2s';
    }
  });
}, 100);

window.playVoiceMessage = function(el) {
  const audio = el.querySelector('audio');
  const text = el.dataset.voice || '';        // ← 读这条语音自己的翻译
  if (audio && audio.src) {
    audio.play().catch(() => toast('语音播放失败'));
  } else {
    toast(text ? '▶ 播放语音：' + text : '▶ 播放语音', 1800);
  }
};

window.openVideoViewer = function(src, time, source) {
  if (!src) return;
  if (document.getElementById('gallery-video-viewer')) return;

  const overlay = document.createElement('div');
  overlay.id = 'gallery-video-viewer';
  overlay.style.cssText = 'position:absolute; inset:0; background:#000; z-index:450; display:flex; flex-direction:column; animation:fadeIn 0.2s ease;';

  overlay.innerHTML = `
    <!-- 顶部栏：关闭按钮 -->
    <div style="padding:54px 20px 10px; display:flex; justify-content:flex-end; align-items:center; flex:none; position:relative; z-index:10;">
      <div onclick="window.__closeVideoViewer()" style="color:#fff; font-size:20px; cursor:pointer; width:36px; height:36px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.15); border-radius:50%; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);">✕</div>
    </div>

    <!-- 视频区 -->
    <div style="flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden;">
      <video
        src="${src}"
        controls
        autoplay
        playsinline
        webkit-playsinline
        preload="auto"
        style="width:100%; max-height:100%; object-fit:contain; background:#000;"
      ></video>
    </div>

    <!-- 底部时间 + 来源（新增） -->
    <div style="flex:none; padding: 4px 20px 34px; text-align:center;">
      ${time ? `<div style="color:#fff; font-size:14px; font-weight:500; text-shadow:0 1px 4px rgba(0,0,0,0.6);">${time}</div>` : ''}
      ${source ? `<div style="color:rgba(255,255,255,0.62); font-size:11.5px; font-weight:400; margin-top:3px; letter-spacing:0.3px; text-shadow:0 1px 4px rgba(0,0,0,0.6);">来源 · ${source}</div>` : ''}
    </div>
  `;

  document.getElementById('screen').appendChild(overlay);

  /* 点开后自动播放（被拦截时先静音播放并给出"开启声音"按钮） */
  const __videoEl = overlay.querySelector('video');
  if (__videoEl) {
    __videoEl.muted = false;
    const __playPromise = __videoEl.play();
    if (__playPromise && typeof __playPromise.catch === 'function') {
      __playPromise.catch(() => {
        __videoEl.muted = true;
        __videoEl.play().catch(() => {});

        const __unmuteBtn = document.createElement('div');
        __unmuteBtn.textContent = '🔊 点击开启声音';

window.openPhotosViewer = function(imgEl) {
  if (!imgEl) return;
  const src = imgEl.getAttribute('data-src') || imgEl.src;
  const time = imgEl.getAttribute('data-time') || '';
  if (!src) return;

  // 如果直接点的是视频封面：走原来的全屏单视频播放（保留你上一轮改的时间显示）
  if (window.__galleryVideoMap && window.__galleryVideoMap[src]) {
    const __galleryList = window.__galleryPhotos || [];
    const __videoItem = __galleryList.find(p => p.src === src) || {};
    window.openVideoViewer(
      window.__galleryVideoMap[src],
      time || __videoItem.time || '',
      __videoItem.source || ''
    );
    return;
  }

  if (document.getElementById('photos-viewer-overlay')) return;

  // 获取完整图库照片列表（若无则退回单张），每项带上是否为视频
  const gallery = (window.__galleryPhotos && window.__galleryPhotos.length)
    ? window.__galleryPhotos.map(p => ({
        src: p.src,
        time: p.time || '',
        source: p.source || '',
        video: (window.__galleryVideoMap && window.__galleryVideoMap[p.src]) || p.video || ''
      }))
    : [{ src, time, source: '', video: (window.__galleryVideoMap && window.__galleryVideoMap[src]) || '' }];

  // 若照片未手动指定 source，则基于 src+time 做确定性 hash 自动分配
  const SOURCES = ['相机', '保存', '分享'];
  gallery.forEach(p => {
    if (!p.source) {
      let hash = 0;
      const str = (p.src || '') + (p.time || '');
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash + str.charCodeAt(i)) | 0;
      }
      p.source = SOURCES[Math.abs(hash) % SOURCES.length];
    }
  });

  // 找到当前点击的照片索引
  let startIndex = gallery.findIndex(p => p.src === src && (p.time || '') === time);
  if (startIndex < 0) startIndex = gallery.findIndex(p => p.src === src);
  if (startIndex < 0) {
    gallery.unshift({ src, time, source: '', video: '' });
    startIndex = 0;
  }

  const total = gallery.length;

  const overlay = document.createElement('div');
  overlay.id = 'photos-viewer-overlay';
  overlay.style.cssText = 'position:absolute; inset:0; background:#000; z-index:400; animation:fadeIn 0.2s ease;';

  overlay.innerHTML = `
    <!-- 顶部栏 -->
    <div style="position:absolute; top:0; left:0; right:0; padding:54px 20px 20px; display:flex; justify-content:space-between; align-items:center; z-index:10; pointer-events:none;">
      <div id="photos-viewer-counter" style="color:#fff; font-size:15px; font-weight:500; text-shadow:0 1px 4px rgba(0,0,0,0.6);">${total > 1 ? (startIndex + 1) + ' / ' + total : (time || '')}</div>
      <div id="photos-viewer-close" style="color:#fff; font-size:20px; cursor:pointer; pointer-events:auto; width:36px; height:36px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.15); border-radius:50%; backdrop-filter:blur(10px);">✕</div>
    </div>

    <!-- 横向滑动轨道 -->
    <div id="photos-viewer-track" style="position:absolute; inset:0; display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; touch-action:pan-x; cursor:grab;">
      ${gallery.map((p, i) => `
        <div class="photos-viewer-slide" data-index="${i}" style="flex:0 0 100%; width:100%; height:100%; scroll-snap-align:center; display:flex; align-items:center; justify-content:center;">
          ${p.video
            ? `<video class="photos-viewer-video" data-index="${i}" src="${p.video}" poster="${p.src}" controls playsinline webkit-playsinline preload="metadata" style="max-width:100%; max-height:100%; object-fit:contain; user-select:none; -webkit-user-drag:none; background:#000;"></video>`
            : `<img src="${p.src}" draggable="false" style="max-width:100%; max-height:100%; object-fit:contain; user-select:none; -webkit-user-drag:none; -webkit-user-select:none; pointer-events:none;" />`}
        </div>
      `).join('')}
    </div>

    <!-- 底部时间 + 来源 -->
    <div style="position:absolute; bottom:0; left:0; right:0; padding:20px 20px 54px; text-align:center; z-index:10; pointer-events:none;">
      <div id="photos-viewer-time" style="color:#fff; font-size:14px; font-weight:500; text-shadow:0 1px 4px rgba(0,0,0,0.6);">${gallery[startIndex].time || ''}</div>
      <div id="photos-viewer-source" style="color:rgba(255,255,255,0.62); font-size:11.5px; font-weight:400; margin-top:3px; letter-spacing:0.3px; text-shadow:0 1px 4px rgba(0,0,0,0.6);">来源 · ${gallery[startIndex].source}</div>
    </div>
  `;

  document.getElementById('screen').appendChild(overlay);

  const track = document.getElementById('photos-viewer-track');
  const counter = document.getElementById('photos-viewer-counter');
  const timeLabel = document.getElementById('photos-viewer-time');
  const sourceLabel = document.getElementById('photos-viewer-source');

  // 隐藏滚动条
  if (!document.getElementById('photos-viewer-style')) {
    const styleEl = document.createElement('style');
    styleEl.id = 'photos-viewer-style';
    styleEl.textContent = `#photos-viewer-track::-webkit-scrollbar { display:none; width:0; height:0; }`;
    document.head.appendChild(styleEl);
  }

  // ===== 视频自动播放 / 暂停 =====
  let unmuteBtn = null;
  let lastAppliedIdx = -1;

  const removeUnmuteBtn = () => {
    if (unmuteBtn) { unmuteBtn.remove(); unmuteBtn = null; }
  };

  const showUnmuteBtn = () => {
    if (unmuteBtn) return;
    unmuteBtn = document.createElement('div');
    unmuteBtn.textContent = '🔊 点击开启声音';
    unmuteBtn.style.cssText = 'position:absolute; left:50%; bottom:96px; transform:translateX(-50%); background:rgba(0,0,0,0.65); color:#fff; font-size:13px; font-weight:500; padding:8px 16px; border-radius:20px; z-index:20; cursor:pointer; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);';
    unmuteBtn.onclick = (e) => {
      e.stopPropagation();
      const curIdx = Math.round(track.scrollLeft / track.clientWidth);
      const v = track.querySelector(`video[data-index="${curIdx}"]`);
      if (v) {
        v.muted = false;
        v.play().catch(() => {});
      }
      removeUnmuteBtn();
    };
    overlay.appendChild(unmuteBtn);
  };

  const tryPlayVideo = (videoEl) => {
    videoEl.muted = false;
    const p = videoEl.play();
    if (p && typeof p.catch === 'function') {
      p.catch(() => {
        videoEl.muted = true;
        videoEl.play().catch(() => {});
        showUnmuteBtn();
      });
    }
  };

  const applyPlayback = (idx) => {
    const idxChanged = (idx !== lastAppliedIdx);
    lastAppliedIdx = idx;
    if (idxChanged) removeUnmuteBtn();

    track.querySelectorAll('video').forEach(v => {
      const vi = parseInt(v.dataset.index, 10);
      if (vi === idx) {
        if (v.paused) tryPlayVideo(v);
      } else {
        if (!v.paused) v.pause();
      }
    });
  };

  // 关闭查看器（统一暂停所有视频）
  const closeViewer = () => {
    track.querySelectorAll('video').forEach(v => {
      try { v.pause(); } catch (e) {}
    });
    overlay.remove();
  };

  const closeBtn = document.getElementById('photos-viewer-close');
  if (closeBtn) closeBtn.addEventListener('click', (e) => { e.stopPropagation(); closeViewer(); });

  // 初始定位到当前照片（双重 rAF 确保 clientWidth 已就绪）
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      track.scrollLeft = startIndex * track.clientWidth;

      // 手动刷新一次标签（初始 scroll 事件可能不触发）
      const idx = Math.round(track.scrollLeft / track.clientWidth);
      const current = gallery[idx];
      if (current) {
        if (counter) counter.textContent = total > 1 ? (idx + 1) + ' / ' + total : (current.time || '');
        if (timeLabel) timeLabel.textContent = current.time || '';
        if (sourceLabel) sourceLabel.textContent = '来源 · ' + (current.source || '');
      }
      applyPlayback(idx);
    });
  });

  // 滚动时更新计数、底部时间，并切换视频播放状态
  let rafPending = false;
  const updateLabels = () => {
    const idx = Math.round(track.scrollLeft / track.clientWidth);
    const current = gallery[idx];
    if (!current) return;
    if (counter) counter.textContent = total > 1
      ? (idx + 1) + ' / ' + total
      : (current.time || '');
    if (timeLabel) timeLabel.textContent = current.time || '';
    if (sourceLabel) sourceLabel.textContent = '来源 · ' + (current.source || '');
    applyPlayback(idx);
  };
  track.addEventListener('scroll', () => {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => { rafPending = false; updateLabels(); });
  }, { passive: true });

  // ============ 鼠标 / 触控笔 拖拽横向滑动 ============
  // 触摸（pointerType === 'touch'）由浏览器原生滚动处理
  let isDown = false;
  let startX = 0;
  let scrollStart = 0;
  let moved = false;

  track.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'touch') return;
    if (e.target.closest('video')) return; // 让视频的原生控制条正常工作
    isDown = true;
    startX = e.clientX;
    scrollStart = track.scrollLeft;
    moved = false;
    track.style.scrollSnapType = 'none';
    track.style.cursor = 'grabbing';
    try { track.setPointerCapture(e.pointerId); } catch (err) {}
  });

  track.addEventListener('pointermove', (e) => {
    if (!isDown) return;
    const dx = e.clientX - startX;
    if (Math.abs(dx) > 5) moved = true;
    track.scrollLeft = scrollStart - dx;
  });

  const endDrag = (e) => {
    if (!isDown) return;
    isDown = false;
    track.style.cursor = 'grab';
    track.style.scrollSnapType = 'x mandatory';
    const idx = Math.round(track.scrollLeft / track.clientWidth);
    track.scrollTo({ left: idx * track.clientWidth, behavior: 'smooth' });
    try { track.releasePointerCapture(e.pointerId); } catch (err) {}
  };
  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);

  // ============ 点击空白 / 图片关闭（点视频不关闭） ============
  track.addEventListener('click', (e) => {
    if (moved) { moved = false; return; }
    if (e.target.closest('video')) return;
    closeViewer();
  });
};

  const uiIncoming = document.getElementById('call-ui-incoming');
  const uiCalling = document.getElementById('call-ui-calling');
  const uiConnected = document.getElementById('call-ui-connected');
  const uiEnded = document.getElementById('call-ui-ended');
  const timerConnected = document.getElementById('call-timer-connected');
  const timerEnded = document.getElementById('call-timer-ended');
  videoMainEl = document.getElementById('main-video-el');

  const formatTime = (sec) => {
    const m = String(Math.floor(sec / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    return `${m}:${s}`;
  };

  const endCall = () => {
    clearInterval(interval);
    if (window.__callSubInterval) {
      clearInterval(window.__callSubInterval);
      window.__callSubInterval = null;
    }
    if (callAudio) {
      try { callAudio.pause(); } catch(e){}
      callAudio.onended = null;
      callAudio = null;
    }
    if (videoMainEl) {
      try { videoMainEl.pause(); } catch(e){}
    }
    if (uiIncoming) uiIncoming.style.display = 'none';
    uiCalling.style.display = 'none';
    uiConnected.style.display = 'none';
    uiEnded.style.display = 'flex';
    if (timerEnded) timerEnded.textContent = formatTime(callDuration);

    // ★ 通话结束，字幕也要一起消失（避免残留在"通话已结束"界面上）
    const __subEl = document.getElementById('call-subtitle');
    if (__subEl) {
      __subEl.style.opacity = '0';
      __subEl.style.display = 'none';
    }
  };

  // ★ 把"进入已接通状态"抽成函数：去电和来电复用同一套
  const enterConnectedState = () => {
    if (!overlay.isConnected) return;

    if (uiIncoming) uiIncoming.style.display = 'none';
    uiCalling.style.display = 'none';
    uiConnected.style.display = 'flex';

    callDuration = 0;
    interval = setInterval(() => {
      callDuration++;
      if (timerConnected) timerConnected.textContent = formatTime(callDuration);
    }, 1000);

    if (CALL_AUDIO_URL && !isVideo) {
      callAudio = new Audio(CALL_AUDIO_URL);
      callAudio.play().catch(() => {});
      callAudio.onended = () => { endCall(); };
    }

    // ★ 只要这条通话有字幕，就启动字幕轮询
    if (callSubtitles.length > 0 && !isVideo) {
      const subtitleEl = document.getElementById('call-subtitle');
      const subtitleInner = document.getElementById('call-subtitle-inner');
      let currentSubIndex = -1;

      if (window.__callSubInterval) clearInterval(window.__callSubInterval);
      window.__callSubInterval = setInterval(() => {
        let curTime = callDuration;
        if (callAudio && !callAudio.paused && callAudio.currentTime > 0) {
          curTime = callAudio.currentTime;
        }

        let activeSub = null;
        for (let i = 0; i < callSubtitles.length; i++) {
          const startTime = i === 0 ? 0 : callSubtitles[i - 1].end;
          if (curTime >= startTime && curTime < callSubtitles[i].end) {
            activeSub = callSubtitles[i];
            break;
          }
        }

        if (activeSub) {
          const idx = callSubtitles.indexOf(activeSub);
          if (currentSubIndex !== idx) {
            currentSubIndex = idx;
            subtitleInner.textContent = activeSub.speaker + '：' + activeSub.text;
            subtitleEl.style.opacity = '1';
          }
        }
      }, 200);
    }

    if (isVideo && videoMainEl) {
      videoMainEl.play().catch(() => {
        videoMainEl.muted = true;
        videoMainEl.play().catch(() => {});
      });
      videoMainEl.onended = () => { endCall(); };
    }
  };

  if (isIncoming) {
    // ★ 别人打给我：等用户点"接听"或"拒绝"
    const btnAnswer = document.getElementById('btn-answer-incoming');
    const btnReject = document.getElementById('btn-reject-incoming');
    if (btnAnswer) btnAnswer.addEventListener('click', enterConnectedState);
    if (btnReject) btnReject.addEventListener('click', endCall);
  } else {
    // ★ 我打出去：3 秒后自动接通
    setTimeout(enterConnectedState, 3000);
  }

  const btnCalling = document.getElementById('btn-hangup-calling');
  const btnConnected = document.getElementById('btn-hangup-connected');
  if (btnCalling) btnCalling.addEventListener('click', endCall);
  if (btnConnected) btnConnected.addEventListener('click', endCall);
  
  document.getElementById('btn-close-ended').addEventListener('click', () => {
    overlay.remove();
  });
}

  const checkWin = (r, c, player) => {
    const dirs = [[0,1],[1,0],[1,1],[1,-1]];

      for (let i = 1; i < 5; i++) {

/* ★★★ 新增：AI 评估单元格分数（连子越多分越高） ★★★ */
const evaluateCell = (r, c, player) => {
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  let score = 0;
  for (let [dr, dc] of dirs) {
    let count = 1;
    for (let i = 1; i < 5; i++) {
      const nr = r + dr * i, nc = c + dc * i;
      if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) break;
      if (board[nr][nc] === player) count++; else break;
    }
    for (let i = 1; i < 5; i++) {
      const nr = r - dr * i, nc = c - dc * i;
      if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) break;
      if (board[nr][nc] === player) count++; else break;
    }
    if (count >= 5) score += 100000;
    else if (count === 4) score += 1000;
    else if (count === 3) score += 100;
    else if (count === 2) score += 10;
    else score += 1;
  }
  return score;
};

/* ★★★ 白棋（郑成灿）自动落子 —— AI 赢 3 局后自然放水（不防守、不再堵你） ★★★ */
const autoGomokuMove = () => {
  if (isGameOver || currentPlayer !== 2) return;

  // ⭐ AI 已赢 3 局后进入"放水"：只发展自己的棋，不堵玩家（看起来像状态不佳）
  const isThrowing = (window.__gomokuAIWins || 0) >= 3;

  let candidates = [];
  let hasAnyPiece = false;

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c] !== 0) { hasAnyPiece = true; continue; }

      // 只考虑已有棋子附近 2 格内的空位，加快速度
      let hasNeighbor = false;
      for (let dr = -2; dr <= 2 && !hasNeighbor; dr++) {
        for (let dc = -2; dc <= 2 && !hasNeighbor; dc++) {
          if (dr === 0 && dc === 0) continue;
          const nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] !== 0) hasNeighbor = true;
        }
      }
      if (!hasNeighbor) continue;

      const attack = evaluateCell(r, c, 2);      // 进攻分（自己连子）
      const defend = evaluateCell(r, c, 1);      // 防守分（对手连子）

      // 正常对局：攻 + 防（又攻又堵，像高手）
      // 放水对局：只看攻，防守权重直接归零（完全不管对手）
      const total = isThrowing ? attack : (attack + defend * 0.9);

      candidates.push({ r, c, score: total, attack });
    }
  }

  let bestR = -1, bestC = -1;

  if (candidates.length === 0) {
    // 空棋盘 → 天元；否则随便找个空位兜底
    if (!hasAnyPiece) { bestR = 7; bestC = 7; }
    else {
      for (let r = 0; r < SIZE && bestR === -1; r++)
        for (let c = 0; c < SIZE && bestR === -1; c++)
          if (board[r][c] === 0) { bestR = r; bestC = c; }
    }
  } else {
    candidates.sort((a, b) => b.score - a.score);
    let chosen = candidates[0];

    // 放水时：如果这一步 AI 自己就能连五，故意放弃，选一个"能下但赢不了"的点
    // 这样 AI 会看起来"总差一步"，最终玩家先连成五
    if (isThrowing && chosen.attack >= 100000) {
      const safe = candidates.find(x => x.attack < 100000);
      if (safe) chosen = safe;
    }

    bestR = chosen.r;
    bestC = chosen.c;
  }
  if (bestR === -1) return;

  // 落子
  board[bestR][bestC] = 2;

  const oldDot = boardEl.querySelector('.last-move-dot');
  if (oldDot) oldDot.remove();

  const cell = boardEl.querySelector(`.gomoku-cell[data-r="${bestR}"][data-c="${bestC}"]`);
  const stone = document.createElement('div');
  stone.className = `stone p2`;
  const dot = document.createElement('div');
  dot.className = 'last-move-dot';
  stone.appendChild(dot);
  cell.appendChild(stone);

  // 判断胜负
  if (checkWin(bestR, bestC, 2)) {
    isGameOver = true;
    clearInterval(window.gomokuTimer);
    updateUI();
    showResult(2);
    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    return;
  }

  currentPlayer = 1;
  updateUI();
};

  window.executeGomokuMove = function() {
    if (isGameOver || selectedR === -1) return;

    const r = selectedR;
    const c = selectedC;
    board[r][c] = currentPlayer;
    
    const oldDot = boardEl.querySelector('.last-move-dot');
    if (oldDot) oldDot.remove();

    const cell = boardEl.querySelector(`.gomoku-cell[data-r="${r}"][data-c="${c}"]`);
    cell.classList.remove('cell-selected');
    
    const preview = cell.querySelector('.preview');
    if (preview) preview.remove();

    const stone = document.createElement('div');
    stone.className = `stone p${currentPlayer}`;
    const dot = document.createElement('div');
    dot.className = 'last-move-dot';
    stone.appendChild(dot);
    cell.appendChild(stone);

    if (checkWin(r, c, currentPlayer)) {
      isGameOver = true;
      clearInterval(window.gomokuTimer);
      updateUI();
      showResult(currentPlayer);
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      return;
    }

    currentPlayer = currentPlayer === 1 ? 2 : 1;
    updateUI();

    // ★ 新增：切到白棋（AI）回合后，延迟自动落子
    if (!isGameOver && currentPlayer === 2) {
      setTimeout(() => autoGomokuMove(), 600);
    }
  };

  updateUI();
};

  if (document.getElementById('ins-post-detail')) return;

  const gallery = (window.__insGridPhotos && window.__insGridPhotos.length)
    ? window.__insGridPhotos
    : [ (typeof p === 'string') ? { src: p } : (p || {}) ];

      <div id="ins-post-likes" style="font-size:13.5px; font-weight:600; color:#000; margin-bottom:6px;">点赞 ${likes} 次</div>

  document.getElementById('screen').appendChild(overlay);

  const likesEl = document.getElementById('ins-post-likes');
  const captionEl = document.getElementById('ins-post-caption');
  const timeEl = document.getElementById('ins-post-time');

  // 隐藏滚动条
  if (!document.getElementById('ins-post-style')) {
    const styleEl = document.createElement('style');
    styleEl.id = 'ins-post-style';
    styleEl.textContent = '#ins-post-track::-webkit-scrollbar { display:none; width:0; height:0; }';
    document.head.appendChild(styleEl);
  }

  // 初始定位到点击的那张（双重 rAF 确保布局就绪）
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      track.scrollLeft = startIndex * track.clientWidth;
    });
  });

  // 滚动时同步更新信息
  let rafPending = false;
  const updateLabels = () => {
    const idx = Math.round(track.scrollLeft / track.clientWidth);
    const item = gallery[idx];
    if (!item) return;
    if (counterEl) counterEl.textContent = `${idx + 1} / ${total}`;
    if (likesEl) likesEl.textContent = `点赞 ${(item.likes !== undefined) ? item.likes : 0} 次`;
    if (captionEl) captionEl.innerHTML = `<b>${user}</b> ${item.caption || ''}`;
    if (timeEl) timeEl.textContent = item.time || '';
  };
  track.addEventListener('scroll', () => {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => { rafPending = false; updateLabels(); });
  }, { passive: true });

  // 鼠标/触控笔拖拽（触屏交给浏览器原生滚动）
  let isDown = false, startX = 0, scrollStart = 0, moved = false;
  track.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'touch') return;
    isDown = true;
    startX = e.clientX;
    scrollStart = track.scrollLeft;
    moved = false;
    track.style.scrollSnapType = 'none';
    track.style.cursor = 'grabbing';
    try { track.setPointerCapture(e.pointerId); } catch (err) {}
  });
  track.addEventListener('pointermove', (e) => {
    if (!isDown) return;
    const dx = e.clientX - startX;
    if (Math.abs(dx) > 5) moved = true;
    track.scrollLeft = scrollStart - dx;
  });
  const endDrag = (e) => {
    if (!isDown) return;
    isDown = false;
    track.style.cursor = 'grab';
    track.style.scrollSnapType = 'x mandatory';
    const idx = Math.round(track.scrollLeft / track.clientWidth);
    track.scrollTo({ left: idx * track.clientWidth, behavior: 'smooth' });
    try { track.releasePointerCapture(e.pointerId); } catch (err) {}
  };
  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);
};

// 双击点赞逻辑
window.doubleTapLike = function(container) {
  const heart = container.querySelector('.heart-anim');
  if (!heart) return;
  heart.classList.remove('active');
  void heart.offsetWidth; 
  heart.classList.add('active');
  if (navigator.vibrate) navigator.vibrate(30);

  const idx = container.dataset.postidx;
  if (idx !== undefined && (!window.__insLiked || !window.__insLiked[idx])) {
    window.toggleInsLike(parseInt(idx));
  }
};

window.toggleInsLike = function(idx) {
  if (!window.__insLiked) window.__insLiked = {};
  const btn = document.querySelector(`.ins-like-btn[data-idx="${idx}"]`);
  const countEl = document.getElementById(`ins-like-count-${idx}`);
  if (!btn || !countEl) return;
  const base = parseInt(btn.dataset.base);

  if (window.__insLiked[idx]) {
    window.__insLiked[idx] = false;
    countEl.textContent = `点赞 ${base} 次`;
    btn.setAttribute('fill', 'none');
    btn.setAttribute('stroke', '#000');
  } else {
    window.__insLiked[idx] = true;
    countEl.textContent = `点赞 ${base + 1} 次`;
    btn.setAttribute('fill', '#FF3040');
    btn.setAttribute('stroke', '#FF3040');
  }
};

        <div style="padding: 56px 10px 10px; display: flex; gap: 4px; flex: none;">
          ${stories.map((_, i) => `
            <div style="flex: 1; height: 2.5px; background: rgba(255,255,255,0.3); border-radius: 2px; overflow: hidden;">
              <div class="story-progress-${i}" style="height: 100%; background: #fff; width: 0%; transition: none;"></div>
            </div>
          `).join('')}
        </div>

        <!-- 头部信息（滑动时跟着变） -->
        <div style="display: flex; align-items: center; gap: 10px; padding: 10px 16px; flex: none;">
          <img id="story-header-avatar" src="${initial.avatar}" style="width: 34px; height: 34px; border-radius: 50%; border: 2px solid #fff; object-fit: cover;" />
          <div id="story-header-name" style="color: #fff; font-size: 14px; font-weight: 600;">${initial.name}</div>
          <div style="color: rgba(255,255,255,0.6); font-size: 12px; margin-left: 4px;">2小时前</div>
          <div style="margin-left: auto; color: #fff; font-size: 20px; cursor: pointer;" onclick="onBack()">✕</div>
        </div>

        <!-- 横向滑动轨道 -->
        <div id="story-track" style="flex: 1; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; touch-action: pan-x;">
          ${stories.map((st, i) => {
            const img = st.content || `https://picsum.photos/800/1600?random=${30 + i}`;
            return `
              <div style="flex: 0 0 100%; width: 100%; height: 100%; scroll-snap-align: center; display: flex; align-items: center; justify-content: center;">
                <img src="${img}" draggable="false" style="width: 100%; height: 100%; object-fit: cover; pointer-events: none; user-select: none;" />
              </div>
            `;
          }).join('')}
        </div>

        <!-- 底部输入栏（固定） -->
        <div style="padding: 16px 16px 34px; display: flex; align-items: center; gap: 12px; background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%); flex: none;">
          <div style="flex: 1; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.5); display: flex; align-items: center; padding: 0 16px; color: rgba(255,255,255,0.8); font-size: 14px;">发送消息</div>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </div>
      </div>
    `
  });

  // 关键状态
  window.__storyIndex = startIndex;
  window.__storyTotal = total;

  const $ = id => document.getElementById(id);

  // 更新头部（头像 + 名字）
  function updateHeader(i) {
    const st = stories[i];
    if (!st) return;
    const av = $('story-header-avatar');
    const nm = $('story-header-name');
    if (av) av.src = st.avatar || '';
    if (nm) nm.textContent = st.name || '';
  }

  // 启动第 i 条的计时 + 进度条动画
  function startStoryTimer(i) {
    if (window.storyTimeout) clearTimeout(window.storyTimeout);

    // 先把所有进度条重置
    for (let k = 0; k < total; k++) {
      const bar = document.querySelector(`.story-progress-${k}`);
      if (bar) {
        bar.style.transition = 'none';
        bar.style.width = k < i ? '100%' : '0%';
      }
    }
    // 当前条开始走 5 秒
    requestAnimationFrame(() => {
      const bar = document.querySelector(`.story-progress-${i}`);
      if (bar) {
        bar.style.transition = 'width 5s linear';
        bar.style.width = '100%';
      }
    });

    // 5 秒后自动跳下一条，最后一条则关闭
    window.storyTimeout = setTimeout(() => {
      const track = $('story-track');
      const next = i + 1;
      if (next < total && track) {
        track.scrollTo({ left: next * track.clientWidth, behavior: 'smooth' });
      } else {
        if (typeof onBack === 'function') onBack();
      }
    }, 5000);
  }

  // 隐藏滚动条
  if (!document.getElementById('story-scroll-style')) {
    const st = document.createElement('style');
    st.id = 'story-scroll-style';
    st.textContent = '#story-track::-webkit-scrollbar { display: none; width: 0; height: 0; }';
    document.head.appendChild(st);
  }

  // 初始定位 + 启动第一条
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const track = $('story-track');
      if (track) track.scrollLeft = startIndex * track.clientWidth;
      updateHeader(startIndex);
      startStoryTimer(startIndex);
    });
  });

  // 滑动时更新头部 + 重启计时
  setTimeout(() => {
    const track = $('story-track');
    if (!track) return;
    let rafPending = false;
    track.addEventListener('scroll', () => {
      if (rafPending) return;
      rafPending = true;
      requestAnimationFrame(() => {
        rafPending = false;
        const idx = Math.round(track.scrollLeft / track.clientWidth);
        if (idx >= 0 && idx < total && idx !== window.__storyIndex) {
          window.__storyIndex = idx;
          updateHeader(idx);
          startStoryTimer(idx);
        }
      });
    }, { passive: true });
  }, 50);

  // 鼠标 / 触控笔拖拽（触屏走原生滚动）
  setTimeout(() => {
    const track = $('story-track');
    if (!track) return;
    let isDown = false, startX = 0, scrollStart = 0;
    track.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'touch') return;
      isDown = true;
      startX = e.clientX;
      scrollStart = track.scrollLeft;
      track.style.scrollSnapType = 'none';
      try { track.setPointerCapture(e.pointerId); } catch (err) {}
    });
    track.addEventListener('pointermove', (e) => {
      if (!isDown) return;
      track.scrollLeft = scrollStart - (e.clientX - startX);
    });
    const endDrag = (e) => {
      if (!isDown) return;
      isDown = false;
      track.style.scrollSnapType = 'x mandatory';
      const idx = Math.round(track.scrollLeft / track.clientWidth);
      track.scrollTo({ left: idx * track.clientWidth, behavior: 'smooth' });
      try { track.releasePointerCapture(e.pointerId); } catch (err) {}
    };
    track.addEventListener('pointerup', endDrag);
    track.addEventListener('pointercancel', endDrag);
  }, 50);
};

    // 解析照片时间
    function parsePhotoDate(timeStr) {
      const match = timeStr ? timeStr.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/) : null;
      if (match) {
        return {
          year: parseInt(match[1]),
          month: parseInt(match[2]),
          day: parseInt(match[3]),
          timestamp: new Date(match[1], match[2] - 1, match[3]).getTime()
        };
      }
      return { year: 1970, month: 1, day: 1, timestamp: 0 };
    }

    // 按时间从新到旧排序
    const sortedPhotos = [...allPhotos].map(p => ({ ...p, parsed: parsePhotoDate(p.time) })).sort((a, b) => b.parsed.timestamp - a.parsed.timestamp);

    window.__galleryPhotos = sortedPhotos;
    window.__galleryVideoMap = {};
    sortedPhotos.forEach(p => {
      if (p.video) window.__galleryVideoMap[p.src] = p.video;
    });

    // ===== 图库单元格渲染：视频封面叠加播放三角 =====
    const photoCellHtml = (p) => {
      if (!p.video) {
        return `<img src="${p.src}" data-src="${p.src}" data-time="${p.time}" style="width:100%;aspect-ratio:1/1;object-fit:cover;display:block;cursor:pointer;" onclick="openPhotosViewer(this)" />`;
      }
      return `<div style="position:relative;aspect-ratio:1/1;overflow:hidden;cursor:pointer;" onclick="openPhotosViewer(this.querySelector('img'))">
        <img src="${p.src}" data-src="${p.src}" data-time="${p.time}" style="width:100%;height:100%;object-fit:cover;display:block;" />
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;">

            <svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
      </div>`;
    };

    // 智能提取：如果照片不够，会自动循环使用前面的照片
    const getPhotos = (start, count) => {
      let res = [];
      for(let i = 0; i < count; i++) {
        res.push(sortedPhotos[(start + i) % sortedPhotos.length]);
      }
      return res;
    };

    const featuredPhotos = getPhotos(0, 4);  // 推荐页：精选照片
    const memoryPhotos = getPhotos(1, 3);    // 推荐页：回忆

      yearGroups[y].push(p);
    });
    let yearHtml = '';
    for (let y in yearGroups) {
      const photos = yearGroups[y];
      yearHtml += `
        <div style="font-size: 24px; font-weight: 700; margin: 10px 0 10px;">${y}年</div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2px; border-radius: 12px; overflow: hidden; margin-bottom: 20px;">

            if (i === 0) return `<div style="grid-column: span 2;"><img src="${p.src}" data-src="${p.src}" data-time="${p.time}" style="width: 100%; aspect-ratio: 16/9; object-fit: cover; cursor: pointer;" onclick="openPhotosViewer(this)" /></div>`;

// 切换照片底层 Tab
window.switchPhotoTab = function(tab) {
  const tabs = ['library', 'foryou', 'albums', 'search'];
  
  tabs.forEach(t => {
    const view = document.getElementById(`photo-tab-${t}`);
    const btn = document.getElementById(`tab-photo-${t}`);
    if (view) {
      if (t === tab) {
        // 如果带有 flex 布局特性，用 flex 显示
        view.style.display = (t === 'library' || t === 'albums') ? 'flex' : 'block';
      } else {
        view.style.display = 'none';
      }
    }
    
    if (btn) {
      const svg = btn.querySelector('svg');
      if (t === tab) {
        btn.style.color = '#007AFF';
        if (t === 'library') {
          svg.setAttribute('fill', 'currentColor');
          svg.setAttribute('stroke', 'none');
        } else {
          svg.setAttribute('fill', 'none');
          svg.setAttribute('stroke', 'currentColor');
        }
      } else {
        btn.style.color = '#8e8e93';
        svg.setAttribute('fill', 'none');
        svg.setAttribute('stroke', 'currentColor');
      }
    }
  });

  if (tab === 'library') {
    window.switchLibView('all');
  }
};

// 切换图库内部的 (年 月 日 所有照片)
window.switchLibView = function(view) {
  const views = ['year', 'month', 'day', 'all'];
  
  views.forEach(v => {
    const viewEl = document.getElementById(`lib-view-${v}`);
    const navEl = document.getElementById(`lib-nav-${v}`);
    
    if (viewEl) viewEl.style.display = (v === view) ? 'block' : 'none';
    
    if (navEl) {
      if (v === view) {
        navEl.style.color = '#000';
        navEl.style.background = '#E5E5EA';
      } else {
        navEl.style.color = '#8e8e93';
        navEl.style.background = 'transparent';
      }
    }
  });
};

  const startTime = Date.now();
  
  overlay.innerHTML = `

    <div style="position:absolute; inset:0; background:linear-gradient(135deg, #2c3e50, #000); pointer-events: none;"></div>
