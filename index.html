        <div style="display:flex; justify-content:space-between; margin-bottom:30px; padding: 0 10px;">
          <div class="jung-speaker-btn" style="display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer;">
            <div class="btn-bg" style="width:76px; height:76px; border-radius:50%; background:rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:center; color:#fff; transition:all 0.2s;">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </div>
            <span style="font-size:13px;">扬声器</span>
          </div>
          <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
            <div style="width:76px; height:76px; border-radius:50%; background:rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:center;">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="#fff"><rect x="2" y="6" width="14" height="12" rx="3" /><path d="M16 10.5L22 7v10l-6-3.5v-3z" /></svg>
            </div>
            <span style="font-size:13px;">FaceTime</span>
          </div>
          <div class="jung-mute-btn" style="display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer;">
            <div class="btn-bg" style="width:76px; height:76px; border-radius:50%; background:rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:center; color:#fff; transition:all 0.2s;">
              <svg class="btn-icon" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="22"/>
              </svg>
            </div>
            <span style="font-size:13px;">静音</span>
          </div>
        </div>

        <div style="display:flex; justify-content:space-between; padding: 0 10px;">
          <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
            <div style="width:76px; height:76px; border-radius:50%; background:rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:center;">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </div>
            <span style="font-size:13px;">添加通话</span>
          </div>
          <div id="jung-btn-hangup" style="display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer;">
            <div id="jung-hangup-bg" style="width:76px; height:76px; border-radius:50%; background:#FF3B30; display:flex; align-items:center; justify-content:center; transition: background 0.3s;">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="#fff" style="transform:rotate(135deg);"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
            </div>
            <span style="font-size:13px;">结束</span>
          </div>
          <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
            <div style="width:76px; height:76px; border-radius:50%; background:rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:center;">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/></svg>
            </div>
            <span style="font-size:13px;">拨号键盘</span>
          </div>
        </div>
      </div>
    </div>
  `;

  // 呼叫中三个小黄点动画
  if (!document.getElementById('jung-calling-style')) {
    const st = document.createElement('style');
    st.id = 'jung-calling-style';
    st.textContent = `
      @keyframes jung-dot-bounce {
        0%, 100% { transform: translateY(0); opacity: .5; }
        50% { transform: translateY(-4px); opacity: 1; }
      }
      .jung-calling-dot {
        display:inline-block; width:6px; height:6px; border-radius:50%;
        background:#FFD60A; animation: jung-dot-bounce 1.2s infinite ease-in-out;
      }
    `;
    document.head.appendChild(st);
  }

  document.getElementById('screen').appendChild(overlay);

  const ringView = overlay.querySelector('#jung-ring-view');
  const connView = overlay.querySelector('#jung-connected-view');
  const timerEl  = overlay.querySelector('#jung-call-timer');
  const subBox   = overlay.querySelector('#jung-call-subtitle');
  const subText  = overlay.querySelector('#jung-call-subtitle-text');

  let timerInterval = null;
  let callAudio = null;
  let subInterval = null;
  let seconds = 0;

  const clearAll = () => {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    if (subInterval) { clearInterval(subInterval); subInterval = null; }
    if (callAudio) {
      try { callAudio.pause(); callAudio.currentTime = 0; } catch (e) {}
      callAudio = null;
    }
    if (window.stopRingtone) window.stopRingtone();
  };

  // 扬声器 / 静音按钮的高亮切换
  overlay.querySelectorAll('.jung-speaker-btn').forEach(btn => {
    btn.onclick = function() {
      this.classList.toggle('active');
      const bg = this.querySelector('.btn-bg');
      if (this.classList.contains('active')) {
        bg.style.background = '#fff'; bg.style.color = '#000';
      } else {
        bg.style.background = 'rgba(255,255,255,0.15)'; bg.style.color = '#fff';
      }
    };
  });
  overlay.querySelectorAll('.jung-mute-btn').forEach(btn => {
    btn.onclick = function() {
      this.classList.toggle('active');
      const bg = this.querySelector('.btn-bg');
      const icon = this.querySelector('.btn-icon');
      if (this.classList.contains('active')) {
        bg.style.background = '#fff'; bg.style.color = '#000';
        icon.innerHTML = `<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="3" y1="3" x2="21" y2="21"/>`;
      } else {
        bg.style.background = 'rgba(255,255,255,0.15)'; bg.style.color = '#fff';
        icon.innerHTML = `<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/>`;
      }
    };
  });

  // 结束通话：时间变「通话结束」→ 按钮变灰 → 1.5 秒后关闭
  const finishCall = () => {
    clearAll();

    if (timerEl) {
      timerEl.textContent = '通话结束';
      timerEl.style.color = 'rgba(255,255,255,0.6)';
    }
    if (subBox) subBox.style.display = 'none';

    const btns = overlay.querySelector('#jung-call-buttons');
    if (btns) { btns.style.opacity = '0.3'; btns.style.pointerEvents = 'none'; }

    const hBtn = overlay.querySelector('#jung-hangup-bg');
    if (hBtn) hBtn.style.background = '#8b1c15';

    setTimeout(() => {
      overlay.style.transition = 'opacity 0.28s ease';
      overlay.style.opacity = '0';
      setTimeout(() => overlay.remove(), 300);
    }, 1500);
  };

  // 拒绝
  overlay.querySelector('#jung-btn-reject').addEventListener('click', () => {
    if (window.stopRingtone) window.stopRingtone();
    if (window.playRingtone) window.playRingtone('iosHangup', false);
    overlay.style.transition = 'opacity 0.25s ease';
    overlay.style.opacity = '0';
    setTimeout(() => overlay.remove(), 280);
  });

  // 接听
  overlay.querySelector('#jung-btn-answer').addEventListener('click', () => {
    if (window.stopRingtone) window.stopRingtone();

    ringView.style.display = 'none';
    connView.style.display = 'flex';

    // 计时
    seconds = 0;
    if (timerEl) timerEl.textContent = '00:00';
    timerInterval = setInterval(() => {
      seconds++;
      if (!timerEl) return;
      const m = String(Math.floor(seconds / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');
      timerEl.textContent = `${m}:${s}`;
    }, 1000);

    // 语音（如果填了链接）
    if (cfg.voiceAudio) {
      try {
        callAudio = new Audio(cfg.voiceAudio);
        callAudio.volume = window.MEDIA_VOLUME;
        callAudio.play().catch(() => {});
        // ★ 语音播完不直接挂断，交给「字幕最后一句」或用户手动挂断收尾
      } catch (e) {}
    }

    // 字幕（如果填了字幕数组）
    const subs = (cfg.subtitles && cfg.subtitles.length) ? cfg.subtitles : [];
    if (subs.length > 0) {
      let lastIdx = -1;
      let endScheduled = false;
      subInterval = setInterval(() => {
        // 时间轴：语音在播 → 用语音的 currentTime；否则用通话计时
        let cur = seconds;
        if (callAudio && !callAudio.paused && callAudio.currentTime > 0) {
          cur = callAudio.currentTime;
        }

        let active = null;
        for (let i = 0; i < subs.length; i++) {
          const start = i === 0 ? 0 : subs[i - 1].end;
          if (cur >= start && cur < subs[i].end) { active = subs[i]; break; }
        }

        if (active) {
          const idx = subs.indexOf(active);
          if (idx !== lastIdx) {
            lastIdx = idx;
            if (subText) {
              subText.textContent = (active.speaker ? active.speaker + '：' : '') + active.text;
            }
            if (subBox) {
              subBox.style.display = 'block';
              subBox.style.opacity = '1';
            }
          }
        }

        // 播到最后一句之后 → 1.5 秒自动挂断
        const lastEnd = subs[subs.length - 1].end || 0;
        if (cur >= lastEnd && !endScheduled) {
          endScheduled = true;
          if (subInterval) { clearInterval(subInterval); subInterval = null; }
          setTimeout(() => {
            if (overlay.isConnected) finishCall();
          }, 1500);
        }
      }, 200);
    }
  });

  // 挂断
  overlay.querySelector('#jung-btn-hangup').addEventListener('click', () => {
    if (window.playRingtone) window.playRingtone('iosHangup', false);
    finishCall();
  });
};


</script>
</body>
</html>
