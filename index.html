/* ========== 全局媒体音量（所有音频 / 视频共用） ==========
   0.0 ~ 1.0。想整体调大调小，只改这一个数字即可。
   例如：觉得网页声音太响，改成 0.7；觉得偏轻，改成 1.0（最大）。
*/
window.MEDIA_VOLUME = 1.0;

/* 资料库 6 首歌本身混音偏响，单独压低音量。
   0.0 ~ 1.0，越小越轻。先用 0.55 试，还嫌大就 0.45，觉得小就 0.7。
   扫描歌曲不走这个值，仍用 MEDIA_VOLUME。*/
window.MUSIC_BASE_VOLUME = 0.55;

/* ========== 全局音乐播放器：脱离 app DOM，切 app 音乐不断 ========== */
(function initGlobalMusicPlayer() {
  if (document.getElementById('music-audio-el')) return;
  const el = document.createElement('audio');
  el.id = 'music-audio-el';
  el.preload = 'none';
  el.volume = window.MEDIA_VOLUME;
  document.body.appendChild(el);
})();

/* ========== 音乐被打断机制 ==========
   规则：
   · 任何非音乐的音频/视频开始播放 → 暂停音乐（记住"用户其实想听"）
   · 那个音频/视频暂停/结束/清空 → 若没有别的媒体还在播 → 自动恢复音乐
   ========== */
window.__activeMediaSet = new Set();
window.__musicInterruptPaused = false;   // 是否因打断而暂停
window.__musicWasPlaying = false;         // 被打断前音乐原本在播

window.__pauseMusicForInterruption = function() {
  const musicEl = document.getElementById('music-audio-el');
  if (!musicEl || musicEl.paused) return;
  window.__musicWasPlaying = true;
  try { musicEl.pause(); } catch (e) {}
  window.__musicInterruptPaused = true;
};

window.__checkMusicInterruption = function() {
  const musicEl = document.getElementById('music-audio-el');
  if (!musicEl) return;

  // 清掉已结束/已暂停的
  for (const m of Array.from(window.__activeMediaSet)) {
    if (m.paused || m.ended) window.__activeMediaSet.delete(m);
  }

  // ★ 私生电话期间（振铃 / 接听通话 / 挂断动画都还没收尾）：
  //   即使 activeMediaSet 已空，也绝不恢复音乐，直接 return
  if (window.__strangerCallActive) return;

  // 没有其他媒体在播 → 尝试恢复音乐
  if (window.__activeMediaSet.size === 0) {
    if (window.__musicInterruptPaused && window.__musicWasPlaying && musicEl.src) {
      try { musicEl.play().catch(() => {}); } catch (e) {}
    }
    window.__musicInterruptPaused = false;
    window.__musicWasPlaying = false;
  }
};

function __trackOtherMedia(el) {
  if (!(el instanceof HTMLMediaElement)) return;
  if (el.id === 'music-audio-el') return;

  window.__activeMediaSet.add(el);
  window.__pauseMusicForInterruption();

  if (!el.__musicWatchBound) {
    el.__musicWatchBound = true;
    const onEnd = () => {
      window.__activeMediaSet.delete(el);
      setTimeout(window.__checkMusicInterruption, 100);
    };
    el.addEventListener('pause', onEnd);
    el.addEventListener('ended', onEnd);
    el.addEventListener('emptied', onEnd);
  }
}

// 1) 重写 HTMLMediaElement.prototype.play —— 覆盖 new Audio() 创建的实例
//    ★ 先把原始 play 存到 window.__origHTMLMediaElementPlay
//      供音乐播放器绕过打断机制使用（音乐切歌时不会被误暂停）
window.__origHTMLMediaElementPlay = HTMLMediaElement.prototype.play;
(function() {
  const origPlay = window.__origHTMLMediaElementPlay;
  HTMLMediaElement.prototype.play = function() {
    const result = origPlay.apply(this, arguments);
    if (this.id !== 'music-audio-el') {
      __trackOtherMedia(this);
    } else {
      // ★ 关键修复：只有当集合里存在【真实在播放】的媒体时，才暂停音乐。
      //   原来的判断是 __activeMediaSet.size > 0 —— 集合里只要有一个
      //   "已暂停但没被清理掉"的死元素，就会把刚切过来的新歌秒暂停，
      //   表现为"不连播"。
      //   现在改为逐个检查：必须 isConnected && !paused && !ended 才算真正在播。
      setTimeout(() => {
        if (this.paused) return;
        let hasRealPlaying = false;
        for (const m of (window.__activeMediaSet || [])) {
          if (m === this) continue;
          if (m.isConnected && !m.paused && !m.ended) {
            hasRealPlaying = true;
            break;
          }
        }
        if (hasRealPlaying) {
          window.__musicWasPlaying = true;
          try { this.pause(); } catch (e) {}
          window.__musicInterruptPaused = true;
        }
      }, 0);
    }
    return result;
  };
})();

// 2) 捕获 DOM 里 autoplay 触发的媒体播放
document.addEventListener('play', function(e) {
  const el = e.target;
  if (!(el instanceof HTMLMediaElement)) return;
  if (el.id === 'music-audio-el') return;
  __trackOtherMedia(el);
}, true);

// 3) 定时兜底检查
setInterval(window.__checkMusicInterruption, 800);

// ============ 播放控制 ============
let isMusicPlaying = true;
window.__musicPlayMode = 'none';   // 'none' | 'all' | 'shuffle'
window.__musicPlayIndex = 0;
window.__musicFakePlayTimer = null;

// 内部：切下一首（供"播放全部"和"随机播放"使用）
function __musicGoNext() {
  // ★ 关键修改：移除 !isMusicPlaying 检查。
  //   onended 触发代表音乐确实已经播完，应该无条件切下一首。
  //   isMusicPlaying 会因为用户在其它地方点过暂停而变成 false，
  //   如果保留检查会直接卡死不再连播。
  if (!window.currentSongs || window.currentSongs.length === 0) return;
  // ★ 切歌时强制把 isMusicPlaying 拉回 true，保证下一首能继续播
  isMusicPlaying = true;

  const len = window.currentSongs.length;

  if (window.__musicPlayMode === 'all') {
    // ★ 从当前歌曲的下一首开始找，一直循环到第一首，不会停在最后一首
    let next = (window.__musicPlayIndex == null ? 0 : window.__musicPlayIndex);
    for (let step = 0; step < len; step++) {
      next = (next + 1) % len;
      if (!window.currentSongs[next].isScanned) {
        window.playMusicSong(next);
        return;
      }
    }
    return;
  }

  if (window.__musicPlayMode === 'shuffle') {
    const pool = [];
    window.currentSongs.forEach((s, i) => { if (!s.isScanned) pool.push(i); });
    if (pool.length === 0) return;

    let idx = pool[Math.floor(Math.random() * pool.length)];
    if (pool.length > 1 && idx === window.__musicPlayIndex) {
      const others = pool.filter(x => x !== window.__musicPlayIndex);
      idx = others[Math.floor(Math.random() * others.length)];
    }
    window.playMusicSong(idx);
  }
}

// 播放全部：从第 1 首开始，依次播到最后一首再循环
window.musicPlayAll = function() {
  if (!window.currentSongs || window.currentSongs.length === 0) {
    toast('资料库中没有歌曲', 1500);
    return;
  }
  // 找第一首非扫描歌曲（正常情况下就是初恋）
  let firstIdx = -1;
  for (let i = 0; i < window.currentSongs.length; i++) {
    if (!window.currentSongs[i].isScanned) { firstIdx = i; break; }
  }
  if (firstIdx < 0) {
    toast('没有可播放的歌曲', 1500);
    return;
  }
  window.__musicPlayMode = 'all';
  window.playMusicSong(firstIdx);
  toast('开始播放全部歌曲', 1500);
};

// 随机播放：随机选一首，播完自动随机选下一首
window.musicPlayShuffle = function() {
  if (!window.currentSongs || window.currentSongs.length === 0) {
    toast('资料库中没有歌曲', 1500);
    return;
  }
  const pool = [];
  window.currentSongs.forEach((s, i) => { if (!s.isScanned) pool.push(i); });
  if (pool.length === 0) {
    toast('没有可播放的歌曲', 1500);
    return;
  }
  window.__musicPlayMode = 'shuffle';
  const idx = pool[Math.floor(Math.random() * pool.length)];
  window.playMusicSong(idx);
  toast('随机播放全部歌曲', 1500);
};

window.playMusicSong = function(index) {
  const song = window.currentSongs[index];
  if (!song) return;

  window.__musicPlayIndex = index;

  const miniPlayer = document.getElementById('music-mini-player');
  const cover = document.getElementById('music-mini-cover');
  const titleEl = document.getElementById('music-mini-title');
  const artistEl = document.getElementById('music-mini-artist');
  const playBtn = document.getElementById('music-mini-play-btn');
  const audioEl = document.getElementById('music-audio-el');

  if (!miniPlayer || !cover || !titleEl || !artistEl) return;

  cover.style.background = song.color;
  titleEl.textContent = song.title;
  artistEl.textContent = song.artist;
  startMiniTitleMarquee();

  isMusicPlaying = true;
  if (playBtn) {
    playBtn.innerHTML = `<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
  }

  // 清掉旧的模拟/兜底定时器
  if (window.__musicFakePlayTimer) {
    clearTimeout(window.__musicFakePlayTimer);
    window.__musicFakePlayTimer = null;
  }
  if (window.__musicAdvanceTimer) {
    clearTimeout(window.__musicAdvanceTimer);
    window.__musicAdvanceTimer = null;
  }

  if (audioEl) {
    audioEl.onended = null;
    audioEl.onerror = null;
    audioEl.volume = song.isScanned ? window.MEDIA_VOLUME : window.MUSIC_BASE_VOLUME;

    if (song.audio) {
      let __advanced = false;
      const __advanceOnFail = () => {
        if (__advanced) return;
        __advanced = true;
        if (window.__musicAdvanceTimer) {
          clearTimeout(window.__musicAdvanceTimer);
          window.__musicAdvanceTimer = null;
        }
        console.warn('[music] 音频加载/播放失败，自动切下一首:', song.title, song.audio);
        if (window.__musicPlayMode !== 'none' && isMusicPlaying) {
          setTimeout(() => { if (isMusicPlaying) __musicGoNext(); }, 600);
        }
      };

      // 先绑定事件，再设置 src 和 play，避免事件丢失
      audioEl.onended = () => {
        if (__advanced) return;
        __advanced = true;
        if (window.__musicAdvanceTimer) {
          clearTimeout(window.__musicAdvanceTimer);
          window.__musicAdvanceTimer = null;
        }
        __musicGoNext();
      };
      audioEl.onerror = __advanceOnFail;

      // ★ 关键修复：清理 __activeMediaSet 里已经"废弃"的元素。
      //   否则重写的 HTMLMediaElement.prototype.play 会在 setTimeout 里
      //   因为 __activeMediaSet.size > 0 而立刻把刚切过来的新歌暂停。
      //   "废弃"定义：不在 DOM 里 / 已结束 / 已暂停。
      if (window.__activeMediaSet) {
        for (const m of Array.from(window.__activeMediaSet)) {
          if (!m.isConnected || m.ended || m.paused) {
            window.__activeMediaSet.delete(m);
          }
        }
      }

      audioEl.src = song.audio;
      // ★ 用原始 play，绕过打断机制 → 切歌时永远不会被 __activeMediaSet 误暂停
      const p = (window.__origHTMLMediaElementPlay || HTMLMediaElement.prototype.play).call(audioEl);
      if (p && typeof p.catch === 'function') {
        p.catch(__advanceOnFail);
      }

      // 超时兜底：10 秒内音频还没进入可播放状态，就当加载失败处理
      window.__musicAdvanceTimer = setTimeout(() => {
        if (audioEl.paused && audioEl.readyState < 2) {
          __advanceOnFail();
        }
      }, 10000);
    } else {
      // 没有音频链接：静默"假播"6 秒后自动切下一首
      audioEl.pause();
      audioEl.removeAttribute('src');
      audioEl.load();
      if (window.__musicPlayMode !== 'none') {
        window.__musicFakePlayTimer = setTimeout(__musicGoNext, 6000);
      }
    }
  }

  miniPlayer.style.transform = 'translateY(0)';

// ---- 歌词同步（跟着音频 currentTime 走，没音频就按打开界面后经过的秒数走） ----
window.startMusicLyricsSync = function(song, lines) {
  if (window.__musicLyricsInterval) {
    clearInterval(window.__musicLyricsInterval);
    window.__musicLyricsInterval = null;
  }

  const audioEl = document.getElementById('music-audio-el');
  const hasAudio = !!(audioEl && audioEl.src);
  const isScannedSong = !!song.isScanned;

  // 无音频时的时钟：fallbackBase 是「当前歌曲已经走过的秒数」，fallbackStart 是「进入本次计时的性能时间点」
  let fallbackBase = 0;
  let fallbackStart = performance.now();
  let activeIdx = -1;

  const fmt = (sec) => {
    if (!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${String(s).padStart(2, '0')}`;
  };

  // ⭐ 对外暴露：无音频时拖动进度条要调整起点
  window.__musicLyricsSeekFallback = (sec) => {
    fallbackBase = sec;
    fallbackStart = performance.now();
  };

  // ⭐ 对外暴露：总时长（无音频时用歌词最后一句 end 兜底）
  window.__musicLyricsFallbackDuration = lines.length ? (lines[lines.length - 1].end || 1) : 1;

  const tick = (overrideCur, force) => {
    if (!document.getElementById('music-lyrics-overlay')) {
      clearInterval(window.__musicLyricsInterval);
      window.__musicLyricsInterval = null;
      return;
    }

    // 拖动过程中不要被定时刷新覆盖（除非 force）
    if (window.__musicLyricsSeeking && !force) return;

    // 当前时间
    let cur = 0;
    if (typeof overrideCur === 'number' && isFinite(overrideCur)) {
      cur = overrideCur;
    } else if (hasAudio && audioEl && !isNaN(audioEl.currentTime)) {
      cur = audioEl.currentTime || 0;
    } else {
      cur = fallbackBase + (performance.now() - fallbackStart) / 1000;
    }

    // 进度条 + 时间
    const progEl = document.getElementById('music-lyrics-progress');
    const thumbEl = document.getElementById('music-lyrics-progress-thumb');
    const curEl = document.getElementById('music-lyrics-cur-time');
    const totalEl = document.getElementById('music-lyrics-total-time');
    const dur = (hasAudio && audioEl && audioEl.duration && isFinite(audioEl.duration))
      ? audioEl.duration
      : (window.__musicLyricsFallbackDuration || (lines[lines.length - 1].end || 1));
    const pct = Math.min(100, (cur / dur) * 100);
    if (progEl) progEl.style.width = pct + '%';
    if (thumbEl) thumbEl.style.left = pct + '%';
    if (curEl) curEl.textContent = fmt(cur);
    if (totalEl) totalEl.textContent = fmt(dur);

    // 找出当前行
    let idx = -1;
    for (let i = 0; i < lines.length; i++) {
      const start = i === 0 ? 0 : lines[i - 1].end;
      if (cur >= start && cur < lines[i].end) { idx = i; break; }
    }
    if (idx === -1 && cur >= lines[lines.length - 1].end) idx = lines.length - 1;

    if (idx !== -1 && idx !== activeIdx) {
      activeIdx = idx;

      // ★ 扫描歌曲：不显示上下句，只把当前这一句居中显示
      if (isScannedSong) {
        const singleEl = document.getElementById('music-lyrics-single-line');
        if (singleEl) singleEl.innerHTML = lines[idx].text || '&nbsp;';
        return;
      }

      const lineEls = document.querySelectorAll('#music-lyrics-track .lyric-line');
      lineEls.forEach((el, i) => el.classList.toggle('active', i === idx));
      const activeEl = lineEls[idx];
      const scrollBox = document.getElementById('music-lyrics-scroll');
      if (activeEl && scrollBox) {
        const top = activeEl.offsetTop - scrollBox.clientHeight / 2 + activeEl.offsetHeight / 2;
        scrollBox.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
      }
    }
  };

  window.__musicLyricsTick = tick;
  window.__musicLyricsInterval = setInterval(() => tick(), 200);
  tick(); // 立即执行一次，避免第一句延迟出现
};

// ---- 进度条拖动跳转（歌词随之滚动） ----
window.__bindMusicLyricsProgressBar = function() {
  const bar = document.getElementById('music-lyrics-progressbar');
  if (!bar || bar.dataset.bound === '1') return;
  bar.dataset.bound = '1';

  const audioEl = document.getElementById('music-audio-el');
  const barFill = document.getElementById('music-lyrics-progress');
  const thumb = document.getElementById('music-lyrics-progress-thumb');
  const curEl = document.getElementById('music-lyrics-cur-time');

  const fmt = (sec) => {
    if (!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${String(s).padStart(2, '0')}`;
  };

  const seekByClientX = (clientX) => {
    const rect = bar.getBoundingClientRect();
    if (!rect.width) return;
    let ratio = (clientX - rect.left) / rect.width;
    ratio = Math.max(0, Math.min(1, ratio));

    let seekTo = 0;
    if (audioEl && audioEl.src && isFinite(audioEl.duration) && audioEl.duration > 0) {
      seekTo = ratio * audioEl.duration;
      try { audioEl.currentTime = seekTo; } catch (e) {}
    } else {
      const dur = window.__musicLyricsFallbackDuration || 1;
      seekTo = ratio * dur;
      if (typeof window.__musicLyricsSeekFallback === 'function') {
        window.__musicLyricsSeekFallback(seekTo);
      }
    }

    // 立即更新 UI（不等 200ms tick）
    const pct = ratio * 100;
    if (barFill) barFill.style.width = pct + '%';
    if (thumb) thumb.style.left = pct + '%';
    if (curEl) curEl.textContent = fmt(seekTo);

    // 让歌词高亮也立刻跟过来（force 忽略 seeking 标记）
    if (typeof window.__musicLyricsTick === 'function') {
      window.__musicLyricsTick(seekTo, true);
    }
  };

  let dragging = false;

  bar.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    dragging = true;
    window.__musicLyricsSeeking = true;
    try { bar.setPointerCapture(e.pointerId); } catch (err) {}
    seekByClientX(e.clientX);
  });

  bar.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    e.preventDefault();
    seekByClientX(e.clientX);
  });

  const end = (e) => {
    if (!dragging) return;
    dragging = false;
    try { bar.releasePointerCapture(e.pointerId); } catch (err) {}
    window.__musicLyricsSeeking = false;
    // 松手后再走一次自然刷新
    if (typeof window.__musicLyricsTick === 'function') window.__musicLyricsTick();
  };

  bar.addEventListener('pointerup', end);
  bar.addEventListener('pointercancel', end);
};

// ---- 歌词页上一首 / 下一首（跳过扫描歌曲）----
window.__musicPrevOrNext = function(dir) {
  if (!window.currentSongs || window.currentSongs.length === 0) return;
  const len = window.currentSongs.length;

  // 随机播放模式：上一首 / 下一首都随机选一首（跳过当前和扫描歌曲）
  if (window.__musicPlayMode === 'shuffle') {
    const pool = [];
    window.currentSongs.forEach((s, i) => {
      if (!s.isScanned && i !== window.__musicPlayIndex) pool.push(i);
    });
    if (pool.length === 0) return;
    const idx = pool[Math.floor(Math.random() * pool.length)];
    window.openMusicLyrics(idx);
    return;
  }

  // 全部播放模式（或之前没设置过）：按列表顺序切，跳过扫描歌曲，循环
  if (window.__musicPlayMode !== 'all') {
    window.__musicPlayMode = 'all';
  }
  let idx = (window.__musicPlayIndex == null) ? 0 : window.__musicPlayIndex;
  const startIdx = idx;
  for (let step = 0; step < len; step++) {
    idx = (idx + dir + len) % len;
    if (!window.currentSongs[idx].isScanned) {
      if (idx === startIdx) return;
      window.openMusicLyrics(idx);
      return;
    }
  }
};

      </div>
      
      <div style="font-size: 17px; color: #007AFF; cursor: pointer;" onclick="closeSafariSearch()">${safariT.cancel}</div>

  `;

  // 挂载到屏幕
  document.getElementById('screen').appendChild(overlay);
  
  // 渲染历史记录
  renderSafariHistory();

  // 🚨 强制聚焦输入框
  const input = document.getElementById('safari-search-input');
  if (input) {
    // 移动端 Safari 有时需要微小的延时或者直接 focus
    input.focus();
    setTimeout(() => { if(document.activeElement !== input) input.focus(); }, 100);
  }
};

// 关闭搜索层
window.closeSafariSearch = function() {
  const overlay = document.getElementById('safari-search-overlay');
  if (overlay) overlay.remove();
};

// 渲染搜索记录
window.renderSafariHistory = function() {
  const container = document.getElementById('safari-search-history');
  if (!container) return;
  
  const t = {
    zh: '搜索记录', en: 'Search History', ko: '검색 기록'
  }[currentLang] || '搜索记录';

  if (safariHistory.length === 0) {
    container.innerHTML = '';
    return;
  }
  
  let html = `<div style="padding: 10px 20px; font-size: 13px; color: #8e8e93; font-weight: 600;">${t}</div>`;
  html += `<div style="background: #fff; margin: 0 16px; border-radius: 12px; overflow: hidden;">`;
  
  safariHistory.forEach((item, i) => {
    html += `
      <div style="display: flex; align-items: center; padding: 12px 16px; border-bottom: ${i === safariHistory.length - 1 ? 'none' : '0.5px solid #E5E5EA'}; cursor: pointer;" onclick="selectSafariHistory('${item}')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="2" style="margin-right: 12px;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <div style="font-size: 16px; color: #000;">${item}</div>
        <div style="margin-left: auto; color: #007AFF; font-size: 20px; padding: 0 4px;" onclick="event.stopPropagation(); deleteSafariHistory(${i});">×</div>
      </div>
    `;
  });
  
  html += `</div>`;
  container.innerHTML = html;
};

// 点击历史记录：只填入搜索框，不关闭搜索层、不跳转首页
window.selectSafariHistory = function(term) {
  const input = document.getElementById('safari-search-input');
  if (input) {
    input.value = term;
    input.focus();
  }
};

// 执行搜索
window.executeSafariSearch = function() {
  const input = document.getElementById('safari-search-input');
  if (!input) return;
  const query = input.value.trim();
  if (!query) return;
  
  // 添加到历史记录
  if (!safariHistory.includes(query)) {
    safariHistory.unshift(query);
    if (safariHistory.length > 10) safariHistory.pop();
  } else {
    safariHistory = safariHistory.filter(item => item !== query);
    safariHistory.unshift(query);
  }
  
  // 关闭搜索层并提示
  closeSafariSearch(); 
  setTimeout(() => {
    toast('正在搜索：' + query, 2000);
  }, 250);
};

// 删除历史记录
window.deleteSafariHistory = function(index) {
  safariHistory.splice(index, 1);
  renderSafariHistory();
};

// 暴露全局事件与定时器逻辑
window.switchClockTab = function(tab) {
  window.clockState.currentTab = tab;
  const views = ['world', 'alarm', 'stopwatch', 'timer'];
  
  views.forEach(v => {
    const el = document.getElementById(`clock-view-${v}`);
    if (el) el.style.display = (v === tab) ? (v === 'stopwatch' || v === 'timer' ? 'flex' : 'block') : 'none';
  });

  document.querySelectorAll('.clock-tab').forEach((el, i) => {
    if (views[i] === tab) {
      el.style.color = '#FF9500';
    } else {
      el.style.color = '#8e8e93';
    }
  });

  if (tab !== 'stopwatch' && window.clockState.stopwatchRunning) stopwatchToggle();
  if (tab !== 'timer' && window.clockState.timerRunning) timerToggle();
};

// ==================== 闹钟开关联动逻辑 ====================
window.toggleAlarm = function(el) {
  // 判断当前是否为打开状态
  const isOn = el.style.background.includes('52, 199, 89') || el.style.background.includes('#34C759');
  
  // 1. 切换开关自身的背景色和圆点位置
  el.style.background = isOn ? '#39393d' : '#34C759';
  el.querySelector('.alarm-switch-knob').style.left = isOn ? '2px' : '22px';
  
  // 2. 查找对应的列表项
  const parent = el.closest('.alarm-item');
  if (parent) {
    const timeEl = parent.querySelector('.alarm-time');

    if (timeEl) {

    if (labelEl && labelEl.textContent === '起床') {
      const sleepTimeEl = document.getElementById('sleep-alarm-time');
      const sleepStatusEl = document.getElementById('sleep-alarm-status');
      
      if (sleepTimeEl && sleepStatusEl) {

          // 刚被开启
          sleepTimeEl.textContent = timeEl.textContent;
          sleepTimeEl.style.color = '#fff';
          sleepStatusEl.textContent = '已开启';
        } else {
          // 刚被关闭
          sleepStatusEl.textContent = '无闹钟';
          sleepTimeEl.style.color = '#8e8e93';
        }
      }
    }
  }
};

// --- 秒表逻辑 ---
function formatStopwatch(ms) {
  const m = Math.floor(ms / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  const cs = Math.floor((ms % 1000) / 10);
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
}

window.stopwatchToggle = function() {
  const state = window.clockState;
  const btnStart = document.getElementById('btn-start');
  const btnLap = document.getElementById('btn-lap');

  if (state.stopwatchRunning) {
    clearInterval(state.stopwatchInterval);
    state.stopwatchRunning = false;
    btnStart.textContent = '启动';
    btnStart.style.background = '#093b1c';
    btnStart.style.color = '#34C759';
    btnLap.textContent = '复位';
    btnLap.style.opacity = '1';
  } else {
    state.stopwatchRunning = true;
    const startTime = Date.now() - state.stopwatchTime;
    state.stopwatchInterval = setInterval(() => {
      state.stopwatchTime = Date.now() - startTime;
      const display = document.getElementById('stopwatch-display');
      if (display) display.textContent = formatStopwatch(state.stopwatchTime);
    }, 10);
    btnStart.textContent = '停止';
    btnStart.style.background = '#3b0d11';
    btnStart.style.color = '#FF453A';
    btnLap.textContent = '计次';
    btnLap.style.opacity = '0.5';
  }
};

window.stopwatchLap = function() {
  const state = window.clockState;
  if (state.stopwatchRunning) {
    toast('计次：' + formatStopwatch(state.stopwatchTime), 1500);
  } else {
    state.stopwatchTime = 0;
    document.getElementById('stopwatch-display').textContent = '00:00.00';
    const btnLap = document.getElementById('btn-lap');
    btnLap.textContent = '计次';
    btnLap.style.opacity = '0.5';
  }
};

// --- 计时器逻辑 ---
function formatTimer(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

window.timerToggle = function() {
  const state = window.clockState;
  const btn = document.getElementById('btn-timer-start');
  if (!btn) return;

  if (state.timerRunning) {
    clearInterval(state.timerInterval);
    state.timerRunning = false;
    btn.textContent = '继续';
    btn.style.background = '#093b1c';
    btn.style.color = '#34C759';
  } else {
    state.timerRunning = true;
    state.timerInterval = setInterval(() => {
      if (state.timerTime > 0) {
        state.timerTime--;
        const display = document.getElementById('timer-display');
        if (display) display.textContent = formatTimer(state.timerTime);
        
        const progress = document.getElementById('timer-progress');
        if (progress) {
          const deg = (1 - state.timerTime / 300) * 360;
          progress.style.transform = `rotate(${deg}deg)`;
        }
      } else {
        clearInterval(state.timerInterval);
        state.timerRunning = false;
        toast('计时结束！', 2000);
      }
    }, 1000);
    btn.textContent = '暂停';
    btn.style.background = '#3b0d11';
    btn.style.color = '#FF453A';
  }
};

window.timerCancel = function() {
  clearInterval(window.clockState.timerInterval);
  window.clockState.timerRunning = false;
  window.clockState.timerTime = 300;
  const display = document.getElementById('timer-display');
  if (display) display.textContent = '05:00';
  const progress = document.getElementById('timer-progress');
  if (progress) progress.style.transform = 'rotate(0deg)';
  
  const btn = document.getElementById('btn-timer-start');
  btn.textContent = '启动';
  btn.style.background = '#093b1c';
  btn.style.color = '#34C759';
};

// 每次渲染时更新表针和时钟
window.tickClock = function() {
  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes();
  
  // 世界时钟数字更新
  document.querySelectorAll('.world-time-display').forEach(el => {
    const offset = parseInt(el.getAttribute('data-offset'));
    let utcH = now.getUTCHours();
    let utcM = now.getUTCMinutes();
    let targetH = (utcH + offset + 24) % 24;
    el.textContent = `${String(targetH).padStart(2, '0')}:${String(utcM).padStart(2, '0')}`;
  });

  // 世界时钟小表盘表针更新
  const hDeg = (h % 12) * 30 + m * 0.5;
  const mDeg = m * 6;
  document.querySelectorAll('.clock-mini-hand.h').forEach(el => el.style.transform = `rotate(${hDeg}deg)`);
  document.querySelectorAll('.clock-mini-hand.m').forEach(el => el.style.transform = `rotate(${mDeg}deg)`);
};

// 启动全局刷新定时器 (用于时钟App)
setInterval(() => {
  if (currentAppId === 'clock' && window.clockState.currentTab === 'world') {
    window.tickClock();
  }
}, 1000);

reg('camera', {

  root() {
    if (window.__camState && window.__camState.rafId) {
      cancelAnimationFrame(window.__camState.rafId);
    }
    if (window.__camState && window.__camState.recordTimer) {
      clearInterval(window.__camState.recordTimer);
    }
    const prev = window.__camState || {};
window.__camState = {
  mode: prev.mode || 'photo',
  ratio: prev.ratio || '4:3',

    requestAnimationFrame(() => { initCamCanvas(); });

      nav: 'none',
      bg: '#000',
      statusLight: true,
      body: `

          .cam-zoom-btn { color: #fff; font-size: 12px; font-weight: 700; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; background: rgba(0,0,0,0.35); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.15); }
          .cam-zoom-btn.active { color: #FFD60A; background: rgba(255,214,10,0.22); border-color: rgba(255,214,10,0.5); transform: scale(1.08); }
          @keyframes shutter-flash { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
          .flash-active { animation: shutter-flash 0.3s ease-out forwards; }
          @keyframes cam-blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0.15; } }
                              @keyframes cam-switch-press {
            0%   { transform: scale(1)    rotate(0deg); }
            25%  { transform: scale(0.78) rotate(0deg); }
            60%  { transform: scale(0.92) rotate(180deg); }
            100% { transform: scale(1)    rotate(360deg); }
          }
          .cam-switch-btn.switch-anim {
            animation: cam-switch-press 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
          }

                    #camera-root.camera-locked .float-back,
          #camera-root.camera-locked .cam-ratio-btn,
          #camera-root.camera-locked .cam-zoom-btn,
          #camera-root.camera-locked .cam-mode-text,
          #camera-root.camera-locked #cam-shutter,
          #camera-root.camera-locked #cam-grid-toggle,
          #camera-root.camera-locked .cam-switch-btn {
            pointer-events: none !important;
            opacity: 0.35 !important;
          }
        </style>

        <div id="camera-root" style="position:absolute; inset:0; background:#000; overflow:hidden; display:flex; flex-direction:column;">
                    <!-- 顶部栏 -->

            <div id="cam-grid-toggle" onclick="camToggleGrid()" style="width:38px; height:38px; border-radius:50%; background:rgba(0,0,0,0.35); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center; color:#fff; cursor:pointer; transition:background 0.2s, color 0.2s;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <line x1="9.5" y1="3" x2="9.5" y2="21"/>

                    <!-- 取景框：铺满整个相机界面 -->

            <video id="cam-source-video" playsinline webkit-playsinline preload="auto" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#000; transition: transform 0.25s ease;"></video>

              <span id="cam-rec-time" style="color:#fff; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;">00:00</span>
            </div>
          </div>

          <!-- 缩放条 -->
          <div style="position:absolute; bottom: 218px; left:0; right:0; display:flex; justify-content:center; gap:12px; z-index:20;">
            ${[1,2,3].map(z => `
              <div class="cam-zoom-btn ${z === st.zoom ? 'active' : ''}" data-zoom="${z}" onclick="camSetZoom(${z})">${z}x</div>

          <div style="position:absolute; bottom: 164px; left:0; right:0; display:flex; justify-content:center; gap:32px; z-index:20;">

            <span class="cam-mode-text ${st.mode==='photo'?'active':''}" data-mode="photo" onclick="camSetMode('photo')">照片</span>

          <div style="position:absolute; bottom:0; left:0; right:0; padding: 0 30px 44px; display:flex; justify-content:space-between; align-items:center; z-index:20; background:linear-gradient(0deg, rgba(0,0,0,0.85), transparent);">

              <div id="cam-shutter-inner" style="width:60px; height:60px; background:${st.mode==='video' ? '#FF3B30' : (st.mode==='portrait' ? '#FFD60A' : '#fff')}; border-radius:50%; transition: all 0.25s;"></div>

/* ===== Naver 搜索历史详情页：修复上滑退出 + 来电遮挡 + 统一退出热区 + 状态栏可见 ===== */
window.__closeNaverHistoryScreenshot = function() {
  const el = document.getElementById('naver-history-screenshot');
  if (el) el.remove();

  // ★ 恢复状态栏原来的 z-index
  const _statusBar = document.getElementById('statusBar');
  if (_statusBar) _statusBar.style.zIndex = window.__naverHistoryPrevStatusZ || '';
  window.__naverHistoryPrevStatusZ = '';
};

window.__swipeExitNaverHistory = function() {
  const el = document.getElementById('naver-history-screenshot');
  if (el) el.remove();

  // ★ 恢复状态栏原来的 z-index
  const _statusBar = document.getElementById('statusBar');
  if (_statusBar) _statusBar.style.zIndex = window.__naverHistoryPrevStatusZ || '';
  window.__naverHistoryPrevStatusZ = '';

  // 上滑退出到桌面
  if (currentAppId === 'naver' && typeof closeApp === 'function') {
    closeApp();
  }
};

window.showNaverHistoryScreenshot = function(title, imgSrc) {
  if (document.getElementById('naver-history-screenshot')) return;

  // ★ 打开详情页时，把状态栏 z-index 临时提到 750：
  //   高于详情页（700），时间和 WiFi 正常显示；
  //   低于来电层（800）和私生来电层（9500），不会遮挡来电。
  const _statusBar = document.getElementById('statusBar');
  if (_statusBar) {
    window.__naverHistoryPrevStatusZ = _statusBar.style.zIndex || '';
    _statusBar.style.zIndex = '750';
  }

  const overlay = document.createElement('div');
  overlay.id = 'naver-history-screenshot';
  overlay.style.cssText = 'position:absolute; inset:0; background:#fff; z-index:700; display:flex; flex-direction:column; animation:fadeIn 0.2s ease;';

  overlay.innerHTML = `
    <style>
      #naver-history-screenshot .naver-history-scroll::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }
      #naver-history-screenshot .naver-history-scroll {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      #naver-history-swipe-zone {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 110px;
        z-index: 40;
        background: transparent;
        touch-action: none;
      }
    </style>

    <!-- 顶部状态栏留白，确保不遮挡时间和 WiFi -->
    <div style="height:50px; flex:none; background:#fff;"></div>

    <!-- 图片滚动区 -->
    <div class="naver-history-scroll"
         style="flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; background:#f2f2f7; position:relative;">

      <div style="position:relative; min-height:100%; background:#fff;">

        <img src="${imgSrc}"
             onerror="this.style.display='none'; this.parentElement.insertAdjacentHTML('beforeend','<div style=&quot;padding:40px 20px;color:#888;font-size:16px;text-align:center;&quot;>图片加载失败<br><br>请检查代码里该条目的 img 链接是否填写正确</div>');"
             style="width:100%; display:block; min-height:100vh; object-fit:cover;" />

        <!-- ★ 统一退出热区：所有详情页都用同一个位置和大小 -->
        <div onclick="window.__closeNaverHistoryScreenshot()"
             style="position:absolute; left:0; top:0; width:120px; height:100px; cursor:pointer; z-index:30; background:transparent;">
        </div>

      </div>
    </div>

    <!-- ★ 底部上滑退出桌面感应区 -->
    <div id="naver-history-swipe-zone"></div>
  `;

  document.getElementById('screen').appendChild(overlay);

  const zone = overlay.querySelector('#naver-history-swipe-zone');
  if (!zone) return;

  let tracking = false;
  let startY = 0;
  let startX = 0;
  let lastY = 0;

  zone.addEventListener('pointerdown', (e) => {
    tracking = true;
    startY = e.clientY;
    startX = e.clientX;
    lastY = e.clientY;
    try { zone.setPointerCapture(e.pointerId); } catch (err) {}
  });

  zone.addEventListener('pointermove', (e) => {
    if (!tracking) return;

    lastY = e.clientY;
    const dy = startY - e.clientY;
    const dx = Math.abs(e.clientX - startX);

    if (dx > 40 && Math.abs(dy) < 30) {
      tracking = false;
      return;
    }

    if (dy > 10 && e.cancelable) {
      e.preventDefault();
    }
  });

  const endSwipe = (e) => {
    if (!tracking) return;
    tracking = false;

    const dy = startY - lastY;
    const dx = Math.abs(e.clientX - startX);

    try { zone.releasePointerCapture(e.pointerId); } catch (err) {}

    if (dy > 70 * (window.SCALE || 1) && dx < 90) {
      window.__swipeExitNaverHistory();
    }
  };

  zone.addEventListener('pointerup', endSwipe);
  zone.addEventListener('pointercancel', () => {
    tracking = false;
  });
};

/* =========================================================
   时间更新及小组件联动
========================================================= */
function updateWeatherUI() {
  const now = new Date();
  const h = now.getHours();

  // ★ 用首尔全年气候算高低温，不再用 20 + (seed % 3)
  const climate = getSeoulClimate(now);
  const high = climate.high;
  const low  = climate.low;

  // 当前小时温度：5:00–15:00 从低到高爬升，15:00–次日5:00 从高到低回落
  let temp = 0;
  if (h >= 5 && h <= 15) {
    temp = Math.round(low + (high - low) * ((h - 5) / 10));
  } else {
    let hh = h < 5 ? h + 24 : h;
    temp = Math.round(high - (high - low) * ((hh - 15) / 14));
  }

  // ① 桌面天气小组件
  const wwTemp = document.getElementById('w-widget-temp');
  const wwRange = document.getElementById('w-widget-range');
  if (wwTemp) wwTemp.textContent = temp + '°';
  if (wwRange) wwRange.textContent = `最高 ${high}° 最低 ${low}°`;

  // ② 天气 App 内部（需要 4.1 里加的 id）
  const appTemp = document.getElementById('app-w-temp');
  const appHigh = document.getElementById('app-w-high');
  const appLow  = document.getElementById('app-w-low');
  if (appTemp) appTemp.textContent = temp + '°';
  if (appHigh) appHigh.textContent = `最高 ${high}°`;
  if (appLow)  appLow.textContent  = `最低 ${low}°`;
}

/* ========== 主屏日历小组件：同步 eventsData ========== */
function updateWidgetCalendar() {
  const container = document.getElementById('widgetCalEvents');
  if (!container) return;

  // 如果日历数据还没初始化（比如还没调用过 APPS['cal'].root()），先不渲染
  if (!window.eventsData) return;

  const now = new Date();
  const todayKey = `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`;
  let events = window.eventsData[todayKey] || [];

  // 今天没有日程 → 找未来最近一个有日程的日期
  if (events.length === 0) {
    const todayTs = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    let nearestTs = Infinity;
    let nearestEvents = [];
    for (const key in window.eventsData) {
      const parts = key.split('-').map(Number);
      if (parts.length !== 3) continue;
      const ts = new Date(parts[0], parts[1] - 1, parts[2]).getTime();
      if (ts >= todayTs && ts < nearestTs) {
        nearestTs = ts;
        nearestEvents = window.eventsData[key];
      }
    }
    if (nearestEvents.length > 0) {
      events = nearestEvents;
    }
  }

  // 小组件最多显示 2 条，避免撑爆
  const displayEvents = events.slice(0, 2);

  if (displayEvents.length === 0) {
    container.innerHTML = `<div style="font-size:11px; color:#8e8e93; padding:4px 0;">暂无日程</div>`;
    return;
  }

  container.innerHTML = displayEvents.map(e => `
    <div class="wc-event">
      <div class="wc-bar" style="background:${e.color || '#B08BBB'}"></div>
      <div class="wc-ev-content">
        <div class="wc-ev-title">${e.title || '日程'}</div>
        <div class="wc-ev-time">${e.time || '全天'}</div>
      </div>
    </div>
  `).join('');
}

function updateTime(){

  }

  // ⭐ 新增：动态更新主屏“时钟”图标的指针
  const ckHour = document.getElementById('icon-clock-hour');
  const ckMin = document.getElementById('icon-clock-minute');
  const ckSec = document.getElementById('icon-clock-second');
  if(ckHour && ckMin && ckSec) {
    const s = d.getSeconds();
    const m = d.getMinutes();
    const h = d.getHours() % 12;
    
    // 计算角度
    const secDeg = s * 6; // 秒针：每秒 6 度
    const minDeg = m * 6 + s * 0.1; // 分针：每分 6 度，加上秒的偏移
    const hourDeg = h * 30 + m * 0.5; // 时针：每小时 30 度，加上分的偏移
    
    // 核心：以 (30,30) 为中心旋转
    ckSec.setAttribute('transform', `rotate(${secDeg}, 30, 30)`);
    ckMin.setAttribute('transform', `rotate(${minDeg}, 30, 30)`);
    ckHour.setAttribute('transform', `rotate(${hourDeg}, 30, 30)`);
  }
    // 同步更新天气
  updateWeatherUI();
}

/* =========================================================
   上滑退出应用手势
========================================================= */
/* =========================================================
   上滑退出应用手势（绑定到独立手势层，更可靠）
========================================================= */
let drag = null;
let isDragging = false;

function getScale(){
  return window.SCALE || 1;
}

const appSwipeZone = document.getElementById('appSwipeZone');

if (appSwipeZone) {
  appSwipeZone.addEventListener('pointerdown', e => {
    if (!appOpen) return;
    drag = { startY: e.clientY, startTime: performance.now(), pointerId: e.pointerId };
    isDragging = false;
    appPage.style.transition = 'none';
    homePage.style.transition = 'none';
    try { appSwipeZone.setPointerCapture(e.pointerId); } catch (err) {}
    // ★ 不再无条件 preventDefault：
    //   点日历 tabbar 等元素时 click 能正常触发；
    //   真正的上滑在 pointermove 里（dy > 6）再拦截。
  });
}

document.addEventListener('pointermove', e => {
  if (!drag) return;
  const s = getScale();
  const dy = Math.max(0, (drag.startY - e.clientY) / s);
  
  if (dy > 6) {
    isDragging = true;
    if (e.cancelable) e.preventDefault(); // 阻止原生滚动抢占手势
  }
  if (!isDragging) return;

  const capped = Math.min(dy, 420);
  const progress = capped / 420;

  appPage.style.transform = `translateY(${-capped * 0.55}px) scale(${1 - progress * 0.14})`;
  appPage.style.opacity = String(1 - progress * 0.85);
  homePage.style.transform = `scale(${0.9 + progress * 0.1})`;
  homePage.style.opacity = String(0.3 + progress * 0.7);
  homePage.style.filter = `blur(${3 - progress * 3}px)`;
});

document.addEventListener('pointerup', e => {
  if (!drag) return;
  const s = getScale();
  const dy = Math.max(0, (drag.startY - e.clientY) / s);
  const dt = Math.max(1, performance.now() - drag.startTime);
  const velocity = dy / dt;

  appPage.style.transition = '';
  homePage.style.transition = '';

  // 稍微调低触发距离和速度阈值，让上滑更容易触发
  const shouldClose = dy > 80 || velocity > 0.5;
  if (shouldClose && isDragging) {
    closeApp();
  } else {
    appPage.style.transform = '';
    appPage.style.opacity = '';
    homePage.style.transform = '';
    homePage.style.opacity = '';
    homePage.style.filter = '';
  }
  drag = null;
  isDragging = false;
});

document.addEventListener('pointercancel', () => {
  if (!drag) return;
  appPage.style.transition = '';
  homePage.style.transition = '';
  appPage.style.transform = '';
  appPage.style.opacity = '';
  homePage.style.transform = '';
  homePage.style.opacity = '';
  homePage.style.filter = '';
  drag = null;
  isDragging = false;
});

document.addEventListener('keydown', e=>{
  if(e.key === 'Escape' && appOpen) closeApp();
});

/* ====== 相机多段视频：前置 → 后置 → 第三段（不循环并锁定） ====== */
window.__getCameraVideoSrc = function(idx) {
  if (idx === 0) return window.__camVideoSrcFront || '';
  if (idx === 1) return window.__camVideoSrcBack  || '';
  if (idx === 2) return window.__camVideoSrcThird || '';
  return '';
};

window.__loadCameraVideo = function(idx) {
  const videoEl = document.getElementById('cam-source-video');
  if (!videoEl) return;
  const src = window.__getCameraVideoSrc(idx);
  if (!src) return;

  videoEl.onended = null;
  videoEl.loop = false;
  videoEl.muted = false;
  videoEl.volume = window.MEDIA_VOLUME;
  videoEl.src = src;

  const p = videoEl.play();
  if (p && typeof p.catch === 'function') {
    p.catch(() => {
      videoEl.muted = true;
      videoEl.play().catch(() => {});
    });
  }

  // 每段播完：前两段 → 播放切换按钮动画 + 自动播下一段；第三段 → 锁定
  videoEl.onended = () => {
    if (idx < 2) {
      window.__playSwitchAnim();
      const next = idx + 1;
      window.__camState.videoIndex = next;
      window.__loadCameraVideo(next);
      if (next === 2) window.__lockCameraControls();  // 进入第三段时立即锁
    } else {
      window.__lockCameraControls();                   // 第三段播完再锁一次
    }
  };
};

window.__playSwitchAnim = function() {
  const btn = document.querySelector('#camera-root .cam-switch-btn');
  if (!btn) return;
  btn.classList.remove('switch-anim');
  void btn.offsetWidth;
  btn.classList.add('switch-anim');
};

window.__lockCameraControls = function() {
  const st = window.__camState;
  if (!st) return;
  st.lockedControls = true;
  const root = document.getElementById('camera-root');
  if (root) root.classList.add('camera-locked');
};

window.camSwitchFacing = function() {
  const st = window.__camState;
  if (!st || st.lockedControls) return;
  if (st.isRecording) window.camStopRecording(true);

  const next = st.videoIndex + 1;
  if (next > 2) return;
  const src = window.__getCameraVideoSrc(next);
  if (!src) return;

  window.__playSwitchAnim();
  st.videoIndex = next;
  window.__loadCameraVideo(next);
  if (next === 2) window.__lockCameraControls();

  if (navigator.vibrate) navigator.vibrate(15);
};

window.camCapture = function() {
  const st = window.__camState;
  if (!st) return;
  if (st.mode === 'video') {
    if (st.isRecording) window.camStopRecording(false);
    else window.camStartRecording();
    return;
  }
  window.camTakePhoto();
};

window.camTakePhoto = function() {
  const flash = document.getElementById('cam-flash-overlay');
  if (flash) {
    flash.classList.remove('flash-active');
    void flash.offsetWidth;
    flash.classList.add('flash-active');
  }

  // 尝试截图（跨域视频可能失败，失败就静默，不弹窗）
  let dataURL = '';
  const video = document.getElementById('cam-source-video');
  if (video && video.videoWidth > 0) {
    try {
      const tmp = document.createElement('canvas');
      tmp.width = video.videoWidth;
      tmp.height = video.videoHeight;
      tmp.getContext('2d').drawImage(video, 0, 0);
      dataURL = tmp.toDataURL('image/jpeg', 0.9);
    } catch (e) {
      dataURL = '';
    }
  }

  if (dataURL) {
    window.__camState.lastPhoto = dataURL;
    const img = document.getElementById('cam-thumb-img');
    const ph = document.getElementById('cam-thumb-placeholder');
    if (img && ph) {
      img.src = dataURL;
      img.style.display = 'block';
      ph.style.display = 'none';
    }
  }

  const inner = document.getElementById('cam-shutter-inner');
  if (inner) {
    inner.style.transform = 'scale(0.82)';
    setTimeout(() => { inner.style.transform = ''; }, 130);
  }

  if (navigator.vibrate) navigator.vibrate(20);
};

window.camStartRecording = function() {
  const st = window.__camState;
  if (st.isRecording) return;
  st.isRecording = true;
  st.recordStart = Date.now();

  const inner = document.getElementById('cam-shutter-inner');
  if (inner) {
    inner.style.width = '30px';
    inner.style.height = '30px';
    inner.style.borderRadius = '6px';
    inner.style.background = '#FF3B30';
  }

  const ind = document.getElementById('cam-rec-indicator');
  const timeEl = document.getElementById('cam-rec-time');
  if (ind) ind.style.display = 'flex';
  if (timeEl) timeEl.textContent = '00:00';

  if (navigator.vibrate) navigator.vibrate(30);

  if (st.recordTimer) clearInterval(st.recordTimer);
  st.recordTimer = setInterval(() => {
    const el = document.getElementById('cam-rec-time');
    if (!el || !el.isConnected) {
      clearInterval(st.recordTimer);
      return;
    }
    const elapsed = Math.floor((Date.now() - st.recordStart) / 1000);
    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    el.textContent = `${m}:${s}`;
  }, 200);
};

window.camStopRecording = function(silent) {

  if (st.recordTimer) {

  if (silent) return;

  // 停止时把当前帧定格到左下角缩略图（跨域失败则静默跳过）
  const video = document.getElementById('cam-source-video');
  const flash = document.getElementById('cam-flash-overlay');
  if (flash) {
    flash.classList.remove('flash-active');

    flash.classList.add('flash-active');
  }
  let dataURL = '';
  if (video && video.videoWidth > 0) {
    try {
      const tmp = document.createElement('canvas');
      tmp.width = video.videoWidth;
      tmp.height = video.videoHeight;
      tmp.getContext('2d').drawImage(video, 0, 0);
      dataURL = tmp.toDataURL('image/jpeg', 0.9);
    } catch (e) {
      dataURL = '';
    }
  }
  if (dataURL) {
    st.lastPhoto = dataURL;
    const img = document.getElementById('cam-thumb-img');
    const ph = document.getElementById('cam-thumb-placeholder');
    if (img && ph) {
      img.src = dataURL;
      img.style.display = 'block';

  if (navigator.vibrate) navigator.vibrate(30);
};

/* =========================================================
   iMessage 韩文键盘（完全还原 iOS 原生样式，仅成灿页自动打字一次）
========================================================= */
(function(){
  const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
  const CHO_TO_JONG = {0:1,1:2,2:4,3:7,5:8,6:16,7:17,9:19,10:20,11:21,12:22,14:23,15:24,16:25,17:26,18:27};

  const KO_TO_ZH = {
    '받았어': '我收到了',
    '받았어요': '我收到了',
    '응': '嗯',
    '고마워': '谢谢',
    '사랑해': '我爱你',
    '보고싶어': '我想你',
    '잘자': '晚安',
    '안녕': '你好'
  };

  window.__koIME = null;
  window.__koIME_autoTyped = false; // ★ 全局记录，确保只自动打字一次

  function getState() {
    if (!window.__koIME) {
      window.__koIME = { contactIndex: 0, committed:'', cho:null, jung:null, jong:null, converted:false, autoTimer:null, autoTyping:false };
    }
    return window.__koIME;
  }

  function currentChar(s) {
    if (s.cho !== null && s.jung !== null) {
      const code = 0xAC00 + (s.cho * 21 + s.jung) * 28 + (s.jong || 0);
      return String.fromCharCode(code);
    }
    if (s.cho !== null) return CHO[s.cho];
    if (s.jung !== null) return JUNG[s.jung];
    return '';
  }

  function fullText(s) { return s.committed + currentChar(s); }

  function commitChar(s) {
    const c = currentChar(s);
    if (c) s.committed += c;
    s.cho = s.jung = s.jong = null;
  }

  window.renderKoIME = function() {
    const s = getState();
    const el = document.getElementById('ko-ime-text');
    const sendBtn = document.getElementById('ko-ime-send');
    if (!el) return;
    const t = fullText(s);
    
    if (t) { 
      el.textContent = t; el.style.color = '#000'; 
      if(sendBtn) { sendBtn.style.background = '#007AFF'; sendBtn.style.color = '#fff'; }
    } else { 
      el.textContent = 'iMessage 信息'; el.style.color = '#8e8e93'; 
      if(sendBtn) { sendBtn.style.background = '#007AFF'; sendBtn.style.color = '#fff'; }
    }

    // 自动转中文
    if (s.autoTimer) { clearTimeout(s.autoTimer); s.autoTimer = null; }
    if (t && KO_TO_ZH[t] && !s.converted) {
      s.autoTimer = setTimeout(() => {
        const st = getState();
        if (fullText(st) === t) {
          st.committed = KO_TO_ZH[t];
          st.cho = st.jung = st.jong = null;
          st.converted = true;
          window.renderKoIME();
        }
      }, 420);
    }
  };

      window.koIMEPress = function(ch, fromAuto) {
    const s = getState();
    if (!fromAuto && s.autoTyping) s.autoTyping = false;
    if (s.converted) {
      s.committed = ''; s.cho = s.jung = s.jong = null; s.converted = false;
    }
    const cIdx = CHO.indexOf(ch);
    const jIdx = JUNG.indexOf(ch);

    if (jIdx >= 0) {
      // ★ 仅修改这里：允许元音单独作为第一个字
      if (s.cho === null && s.jung === null) {
        s.jung = jIdx;
      }
      // 下面是完全恢复的原有逻辑
      else if (s.cho !== null && s.jung === null) {
        s.jung = jIdx;
      }
      else if (s.cho !== null && s.jung !== null) { 
        commitChar(s); s.jung = jIdx; 
      }
      else if (s.cho === null && s.jung !== null) { 
        commitChar(s); s.jung = jIdx; 
      }
    } else if (cIdx >= 0) {
      // ★ 仅新增一条：如果当前只有纯元音，按辅音时提交元音并开始新字
      if (s.cho === null && s.jung !== null) {
        commitChar(s); s.cho = cIdx;
      }
      // 下面完全恢复原有逻辑
      else if (s.cho === null && s.jung === null) {
        s.cho = cIdx;
      }
      else if (s.cho !== null && s.jung === null) { 
        commitChar(s); s.cho = cIdx; 
      }
      else if (s.cho !== null && s.jung !== null && s.jong === null) {
        const j = CHO_TO_JONG[cIdx];
        if (j !== undefined) s.jong = j;
        else { commitChar(s); s.cho = cIdx; }
      } else if (s.cho !== null && s.jung !== null && s.jong !== null) {
        commitChar(s); s.cho = cIdx;
      }
    }
    window.renderKoIME();
  };

/* =========================================================
   ★ 自动打出 "ㅇㅋ" 的打字动画
   ---------------------------------------------------------
   作用：
   · 成灿发来"等我回到…"之后，自动弹出键盘，
     依次按下 ㅇ → ㅋ，然后自动发送 "ㅇㅋ"。
   · 如果玩家误关闭了键盘，再次点击下方输入框会重新播放；
     直到 "ㅇㅋ" 真正发出为止。
   · "ㅇㅋ" 发出后，键盘恢复正常自由输入，不会再次自动播放。
   ========================================================= */
window.__koIME_okTypingToken = window.__koIME_okTypingToken || 0;

window.runOkTypingAnimation = function() {
  // 已经发出过 "ㅇㅋ" → 不再重播
  if (window.__koIME_okSent) return;
  // 已经在播放 → 不重复启动
  if (window.__koIME_okTypingRunning) return;

  // 键盘还没打开 → 先打开；openIMessageKeyboard 末尾会自动调回本函数
  if (!document.getElementById('ko-ime-overlay')) {
    window.__koIME_pendingOkTyping = false;
    window.__koIME_okTypingPending = true;
    window.openIMessageKeyboard(0);
    return;
  }

  window.__koIME_okTypingRunning = true;
  const myToken = ++window.__koIME_okTypingToken;
  const isAlive = () => (myToken === window.__koIME_okTypingToken) && !!document.getElementById('ko-ime-overlay');

  const s = window.__koIME;
  if (!s) { window.__koIME_okTypingRunning = false; return; }

  // 清空残留的输入内容
  s.committed = '';
  s.cho = s.jung = s.jong = null;
  s.converted = false;
  s.autoTyping = false;
  if (typeof window.renderKoIME === 'function') window.renderKoIME();

  const pressKey = (key, delay) => {
    setTimeout(() => {
      if (!isAlive()) { window.__koIME_okTypingRunning = false; return; }
      const el = document.querySelector('#ko-ime-overlay .ko-key[data-k="' + key + '"]');
      if (el) {
        el.style.background = '#e5e5ea';
        setTimeout(() => { if (el.isConnected) el.style.background = '#fff'; }, 110);
      }
      window.koIMEPress(key, true);
    }, delay);
  };

  // 按下 ㅇ → ㅋ（最终组成 "ㅇㅋ"）
  pressKey('ㅇ', 400);
  pressKey('ㅋ', 700);

  // 自动发送
  setTimeout(() => {
    if (!isAlive()) { window.__koIME_okTypingRunning = false; return; }
    window.__koIME_okTypingRunning = false;
    window.koIMESend();
  }, 1400);
};

window.enterKktJungChat = function() {
  window.kktCurrentTab = 'chats';
  const idx = FRIENDS.findIndex(f => f.name === 'ㅈㅅㅊ');
  if (idx < 0) return;

  const appPageEl = $('#appPage');

  // 无动画直接切换到 KKT（避免先闪一下聊天列表再进详情）
  appPageEl.style.transition = 'none';
  appPageEl.style.transform = '';
  appPageEl.style.opacity = '';
  appPageEl.style.borderRadius = '';
  appPageEl.style.transformOrigin = '';

  homePageEl.style.transition = 'none';
  homePageEl.style.transform = 'scale(0.9)';
  homePageEl.style.opacity = '0.3';
  homePageEl.style.filter = 'blur(3px)';
  homePageEl.classList.add('zoomed');

  currentAppId = 'kkt';
  appOpen = true;

  // 下一帧恢复过渡，供以后关闭时飞回图标用
  requestAnimationFrame(() => {
    appPageEl.style.transition = '';
    homePageEl.style.transition = 'transform 0.45s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.35s ease, filter 0.35s ease';

window.dismissKktStoryBanner = function(fromClick) {

    clearTimeout(window.__kktBannerTimer);
    window.__kktBannerTimer = null;
  }
  const banner = document.getElementById('kkt-story-banner');
  if (!banner) return;
  banner.style.transform = 'translateY(-160%)';
  banner.style.opacity = '0';
  setTimeout(() => banner.remove(), 480);

  // ★ 只有「自动超时消失」才推入通知中心；用户点击横幅直接进入聊天，不推入
  if (!fromClick) {
    window.__notifList = window.__notifList || [];
    if (!window.__notifList.some(n => n.app === 'kkt' && n.body === '盯着你~')) {
      window.__notifList.unshift({
        app: 'kkt',
        title: 'ㅈㅅㅊ',
        body: '盯着你~',
        time: '现在'
      });
    }
  }
};

    } catch (e) {}
  };

  const showResult = (title, desc, delay) => {
    ringView.style.display = 'none';
    connView.style.display = 'none';
    resultCard.style.display = 'flex';
    const t = overlay.querySelector('#sc-result-title');
    const d = overlay.querySelector('#sc-result-desc');
    if (t) t.textContent = title || '已加入黑名单';
    if (d) d.textContent = desc || '该号码将无法再拨打你的电话';

    setTimeout(() => {
      overlay.style.transition = 'opacity 0.25s ease';
      overlay.style.opacity = '0';
          setTimeout(() => {
      overlay.remove();
      window.stopRingtone();
      // ★ 私生通话完全结束（overlay 已移除），关闭开关
      window.__strangerCallActive = false;
      // ★ 立刻触发一次音乐恢复检查，不用等 800ms 轮询
      if (typeof window.__checkMusicInterruption === 'function') {
        window.__checkMusicInterruption();
      }
      if (typeof onEnded === 'function') onEnded();
    }, 280);
    }, delay || 1800);
  };

  // 结束通话逻辑（完全复刻“电话 App 接通后的结束状态”）
  const endConnectedCall = (blocked) => {
    clearInterval(timerInterval);
    scriptTimers.forEach(t => clearTimeout(t));
    scriptTimers = [];
    if (blocked) addToBlacklist();
    window.stopRingtone();
    window.playRingtone('iosHangup', false);

    // 1. 时间变文字
    if (timerEl) {
      timerEl.textContent = '通话结束';
      timerEl.style.color = 'rgba(255,255,255,0.6)';
    }

    // 2. 隐藏字幕
    if (subBox) subBox.style.display = 'none';

    // 3. 按钮变灰
    const btns = overlay.querySelector('#sc-buttons');
    if (btns) {
      btns.style.opacity = '0.3';
      btns.style.pointerEvents = 'none';
    }

    // 4. 挂断按钮变暗红
    const hBtn = overlay.querySelector('#sc-hangup-bg');
    if (hBtn) hBtn.style.background = '#8b1c15';

    // 5. 过 1.5 秒后弹出结果
    setTimeout(() => {
      if (blockAfter && blocked) {
        showResult('已加入黑名单', '该号码将无法再拨打你的电话', 2000);
      } else {
        showResult('通话已结束', '', 1200);
      }
    }, 1500);
  };

  /* ---- 拒绝：直接加入黑名单 ---- */
  overlay.querySelector('#sc-btn-reject').addEventListener('click', () => {
    window.stopRingtone();
    window.playRingtone('iosHangup', false);
    if (blockAfter) {
      addToBlacklist();
      showResult('已加入黑名单', '该号码将无法再拨打你的电话', 2000);
    } else {
      showResult('已拒接', '', 1200);
    }
  });

  /* ---- 接听：逐句播台词 → 自动挂断 + 加入黑名单 ---- */
  overlay.querySelector('#sc-btn-answer').addEventListener('click', () => {
    window.stopRingtone();

    ringView.style.display = 'none';
    connView.style.display = 'flex';

    seconds = 0;
    timerInterval = setInterval(() => {
      seconds++;
      const m = String(Math.floor(seconds / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');
      if (timerEl) timerEl.textContent = `${m}:${s}`;
    }, 1000);

    let acc = 0;
    script.forEach((line) => {
      const startDelay = acc;
      acc += (line.duration || 1800) + 300;

      const t = setTimeout(() => {
        if (!overlay.isConnected) return;
        subBox.style.display = 'block';
        subBox.style.opacity = '1';
        subText.textContent = line.text || '';
      }, startDelay);
      scriptTimers.push(t);
    });

    // 台词播完 → 自动挂断 + 拉黑
    const endTimer = setTimeout(() => {
      if (!overlay.isConnected) return;
      subBox.style.opacity = '0';
      setTimeout(() => {
        if (!overlay.isConnected) return;
        endConnectedCall(true);
      }, 400);
    }, acc + 800);
    scriptTimers.push(endTimer);
  });

  /* ---- 通话中手动挂断 ---- */
  overlay.querySelector('#sc-btn-hangup').addEventListener('click', () => {
    endConnectedCall(true);
  });
};

/* ---------------- 从最近通话「未接来电」随机触发私生来电 ---------------- */
window.triggerStrangerCallFromMissed = function() {
  // 没打开过电话 App 时，先把通话数据生成出来
  if (!window.__phoneCallsData || !window.__phoneCallsData.length) {
    try { APPS['phone'].root(); } catch (e) {}
  }

  const all = window.__phoneCallsData || [];
  const blacklist = window.__phoneBlacklist || [];

  const candidates = all.filter(c => {
    if (c.type !== 'missed') return false;
    const key = (c.number || c.name || '').trim();
    if (!key) return false;
    if (blacklist.includes(key)) return false;
    if (c.blacklisted) return false;
    return true;
  });

  if (candidates.length === 0) return;

  const picked = candidates[Math.floor(Math.random() * candidates.length)];
  const number = picked.number || picked.name || '';
  const displayName = picked.number || picked.name || '未知号码';

  window.showStrangerIncomingCall({
    number,
    displayName,
    region: picked.loc || '未知来电',
    blockAfter: true,
    script: [
      { text: '银硕欧巴，为什么等这么久才接呢？', duration: 2000 },
      { text: '我好不容易买到你的电话的。', duration: 2200 }
    ]
  });
};

/* ---------------- 锁屏打开后第 5 分钟触发一次（遇到其他视频/音频播放时自动延后） ---------------- */
(function initPrivateCallTimer(){
  if (window.__privateCallTimerStarted) return;
  window.__privateCallTimerStarted = true;

  // ★ 判断此刻是否有「其他」视频/音频正在播放
  //   规则：
  //   · 只排除背景音乐播放器（music-audio-el），否则用户听歌时永远等不到来电；
  //     真来电时音乐会被打断机制自动暂停，符合真实 iOS 行为。
  //   · 相机取景框 cam-source-video 现在也算「正在播放」——
  //     相机的三段视频会顺序播完（第三段播完后自动锁定），播完后不再算播放中，
  //     这时私生来电才会正常触发。
  //   · 其他 audio / video（KKT 语音消息、通话录音、Facetime、视频查看器、
  //     相册视频、快捷指令录音、相机三段视频等）都算「正在播放」，需要延后。
  function hasOtherMediaPlaying() {
    // 方式 1：遍历页面上所有 <video> / <audio> 元素
    const mediaEls = document.querySelectorAll('video, audio');
    for (const el of mediaEls) {
      if (el.id === 'music-audio-el') continue;
      if (!el.paused && !el.ended) return true;
    }
    // 方式 2：用全局媒体集合兜底（覆盖 new Audio() 创建、未挂到 DOM 上的实例）
    if (window.__activeMediaSet && window.__activeMediaSet.size > 0) {
      for (const m of window.__activeMediaSet) {
        if (m.id === 'music-audio-el') continue;
        if (!m.paused && !m.ended) return true;
      }
    }
    return false;
  }

  // ★ 判断是否 KKT 剧情 / iMessage 动画正在播放
  function hasActiveStoryAnimation() {
    return !!(window.__kktAwaitingMyFirstMessage ||
              window.__kktAwaitingFinalSend ||
              window.__koIME_pendingOkTyping ||
              document.getElementById('ko-ime-overlay') ||
              document.getElementById('kkt-ko-ime') ||
              document.getElementById('kkt-typing-indicator') ||
              document.getElementById('kkt-story-banner'));
  }

  function tryTriggerStrangerCall() {
    // 已经弹出来电了就不再重复触发
    if (document.getElementById('stranger-call-overlay')) return;

    // ★ 成灿来电还在 → 等它结束再触发私生来电
    if (document.getElementById('jung-incoming-overlay')) {
      setTimeout(tryTriggerStrangerCall, 1500);
      return;
    }

    // 还有其他视频/音频正在播 → 延后 1.5 秒再检查一次
    if (hasOtherMediaPlaying()) {
      setTimeout(tryTriggerStrangerCall, 1500);
      return;
    }

    // ★ KKT / iMessage 动画还没播完 → 等动画结束后再检查
    if (hasActiveStoryAnimation()) {
      setTimeout(tryTriggerStrangerCall, 1500);
      return;
    }

    // 没有任何其他媒体在播放 → 正常触发私生来电
    window.triggerStrangerCallFromMissed();
  }

  setTimeout(tryTriggerStrangerCall, 5 * 60 * 1000);
})();

/* ---- KKT 专用韩文输入法（自动打字 + 转中文 + 自由输入） ---- */
window.openKktKoIME = function(hanText, zhText, onSent) {
  if (document.getElementById('kkt-ko-ime')) return;

  const isFreeInput = (!hanText || hanText === '');
  const chars = isFreeInput ? [] : hanText.split('');

  // 韩文字母组合
  const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
  const CHO_TO_JONG = {0:1,1:2,2:4,3:7,5:8,6:16,7:17,9:19,10:20,11:21,12:22,14:23,15:24,16:25,17:26,18:27};

  const imeState = { committed: '', cho: null, jung: null, jong: null };

  function currentChar(s) {
    if (s.cho !== null && s.jung !== null) {
      const code = 0xAC00 + (s.cho * 21 + s.jung) * 28 + (s.jong || 0);
      return String.fromCharCode(code);
    }
    if (s.cho !== null) return CHO[s.cho];
    if (s.jung !== null) return JUNG[s.jung];
    return '';
  }
  function commitChar(s) {
    const c = currentChar(s);
    if (c) s.committed += c;
    s.cho = s.jung = s.jong = null;
  }
  function renderImeText() {
    const textEl = document.getElementById('kkt-ko-ime-text');
    if (!textEl) return;
    const t = imeState.committed + currentChar(imeState);
    textEl.textContent = t || '输入一条信息';
    textEl.style.color = t ? '#000' : '#8e8e93';
    const sendBtn = document.getElementById('kkt-ko-ime-send');
    if (sendBtn) sendBtn.style.opacity = t ? '1' : '0.4';
  }
  function pressImeKey(ch) {
    const s = imeState;
    const cIdx = CHO.indexOf(ch);
    const jIdx = JUNG.indexOf(ch);
    if (jIdx >= 0) {
      if (s.cho === null && s.jung === null) s.jung = jIdx;
      else if (s.cho !== null && s.jung === null) s.jung = jIdx;
      else if (s.cho !== null && s.jung !== null) { commitChar(s); s.jung = jIdx; }
      else if (s.cho === null && s.jung !== null) { commitChar(s); s.jung = jIdx; }
    } else if (cIdx >= 0) {
      if (s.cho === null && s.jung !== null) { commitChar(s); s.cho = cIdx; }
      else if (s.cho === null && s.jung === null) s.cho = cIdx;
      else if (s.cho !== null && s.jung === null) { commitChar(s); s.cho = cIdx; }
      else if (s.cho !== null && s.jung !== null && s.jong === null) {
        const j = CHO_TO_JONG[cIdx];
        if (j !== undefined) s.jong = j;
        else { commitChar(s); s.cho = cIdx; }
      } else if (s.cho !== null && s.jung !== null && s.jong !== null) {
        commitChar(s); s.cho = cIdx;
      }
    }
    renderImeText();

  document.getElementById('screen').appendChild(overlay);

  // 键盘点击：自动模式下有按压反馈但忽略内容；自由模式下执行韩文字母组合
  // ★ 新增：Shift 切换状态（切换双辅音/双元音）
  let imeShiftActive = false;
  const row1Normal = ['ㅂ','ㅈ','ㄷ','ㄱ','ㅅ','ㅛ','ㅕ','ㅑ','ㅐ','ㅔ'];
  const row1Shift  = ['ㅃ','ㅉ','ㄸ','ㄲ','ㅆ','ㅛ','ㅕ','ㅑ','ㅒ','ㅖ'];

  function updateShift() {
    const shiftKey = overlay.querySelector('.kkt-ko-key[data-k="SHIFT"]');
    if (shiftKey) {
      shiftKey.style.background = imeShiftActive ? '#fff' : '#ABB0B8';
    }
    const row1 = overlay.querySelectorAll('.ko-row1 .kkt-ko-key');
    row1.forEach((el, i) => {
      const target = imeShiftActive ? row1Shift[i] : row1Normal[i];
      el.textContent = target;
      el.dataset.k = target;
    });
  }

  overlay.querySelectorAll('.kkt-ko-key').forEach(el => {
    el.addEventListener('click', () => {
      const k = el.dataset.k;

      el.style.background = '#e5e5ea';
      setTimeout(() => {
        if (!el.isConnected) return;
        const kv = el.dataset.k;
        el.style.background = (kv === 'SHIFT' || kv === 'DEL') ? '#ABB0B8' : '#fff';
      }, 110);

      if (!isFreeInput) return;

      if (k === 'DEL') {
        if (imeState.jong !== null) imeState.jong = null;
        else if (imeState.jung !== null) imeState.jung = null;
        else if (imeState.cho !== null) imeState.cho = null;
        else imeState.committed = imeState.committed.slice(0, -1);
        renderImeText();
      } else if (k === 'SPACE') {
        commitChar(imeState);
        imeState.committed += ' ';
        renderImeText();
      } else if (k === 'SHIFT') {
        // ★ 切换双辅音/双元音
        imeShiftActive = !imeShiftActive;
        updateShift();
      } else {
        pressImeKey(k);
      }
    });
  });

  if (isFreeInput) {
    window.__kktKoIMEPending = { hanText: '', zhText: '', onSent, freeInput: true };
    renderImeText();
    return;
  }

  // 自动打字模式
  let i = 0;
  const textEl = document.getElementById('kkt-ko-ime-text');
  const sendBtn = document.getElementById('kkt-ko-ime-send');

  function typeNext() {
    if (!overlay.isConnected) return;
    if (i >= chars.length) {
      // ★ 打字结束：立即注册发送回调，按钮亮起瞬间就能发
      window.__kktKoIMEPending = { hanText, zhText, onSent, freeInput: false };
      if (sendBtn) sendBtn.style.opacity = '1';
      // 视觉收尾（文字换成中文、按键复位）延迟不影响发送
      setTimeout(() => {
        if (!overlay.isConnected) return;
        if (textEl) { textEl.textContent = zhText; textEl.style.color = '#000'; }
        overlay.querySelectorAll('.kkt-ko-key').forEach(k => {
          const kv = k.dataset.k;
          k.style.background = (kv === 'SHIFT' || kv === 'DEL') ? '#ABB0B8' : '#fff';
        });
      }, 500);
      return;
    }
    const ch = chars[i++];
    const keys = overlay.querySelectorAll('.kkt-ko-key');
    if (keys.length) {
      const rk = keys[Math.floor(Math.random() * keys.length)];
      rk.style.background = '#e5e5ea';
      setTimeout(() => {
        if (!rk.isConnected) return;
        const kv = rk.dataset.k;
        rk.style.background = (kv === 'SHIFT' || kv === 'DEL') ? '#ABB0B8' : '#fff';
      }, 110);
    }
    if (textEl) {
      if (textEl.textContent === '输入一条信息') textEl.textContent = '';
      textEl.style.color = '#000';
      textEl.textContent += ch;
    }
    setTimeout(typeNext, 140);
  }
  setTimeout(typeNext, 400);
};

window.sendKktKoIME = function() {
  const pending = window.__kktKoIMEPending;
  if (!pending) return;

  const cb = pending.onSent;
  let textToSend = '';

  if (pending.freeInput) {
    const textEl = document.getElementById('kkt-ko-ime-text');
    textToSend = textEl ? textEl.textContent.trim() : '';
    if (!textToSend || textToSend === '输入一条信息') return;
  } else {
    textToSend = pending.zhText || '';
  }

  window.closeKktKoIME();
  if (typeof cb === 'function') cb(textToSend);
};

window.closeKktKoIME = function() {
  const el = document.getElementById('kkt-ko-ime');
  if (el) el.remove();
  window.__kktKoIMEPending = null;
  // 注意：不重置 __kktAwaitingMyFirstMessage，等待用户再次点击输入框重来
};

/* ---- 退出聊天详情时：暂停动画、关闭键盘、让旧定时器失效 ---- */
window.__pauseKktAnimationOnExit = function() {
  // 递增 token：让所有仍在等待的定时器失效（避免退出后旧动画继续操作 DOM）
  window.__kktAnimToken = (window.__kktAnimToken || 0) + 1;

  // 关闭韩文键盘
  try { window.closeKktKoIME(); } catch (e) {}
  // 移除成灿的"正在输入…"气泡
  try { window.hideKktTyping(); } catch (e) {}

  // 动画未完成时，允许下次进入重新走判定流程
  if (!window.__kktAnimationFinished) {
    window.__kktAnimationPlayed = false;
  }
};

/* ---- 我方第一句发出后：播放成灿回复 → 进入第二句等待 ---- */
window.__kktAfterFirstMsg = function() {
  const myToken = window.__kktAnimToken || 0;
  const isAlive = () => (myToken === (window.__kktAnimToken || 0)) && !!document.getElementById('kkt-detail-chat-list');
  if (!isAlive()) return;

  setTimeout(() => {
    if (!isAlive()) return;
    window.showKktTyping();

    setTimeout(() => {
      if (!isAlive()) return;
      window.hideKktTyping();
      window.appendKktJungMessage('那就说你玩游戏输了要这样做');
      const jung = FRIENDS.find(f => f.name === 'ㅈㅅㅊ');
      if (jung) {
        jung.msgs.push({ t: '那就说你玩游戏输了要这样做', me: false });
        sortFriendsByLastMessage();
      }

      setTimeout(() => {
        if (!isAlive()) return;
        window.triggerKktSecondMessage();
      }, 600);
    }, 2000);
  }, 800);
};

window.triggerKktAnimation = function(playJungFirstMessage) {
  if (window.__kktAnimationPlayed) return;
  if (!document.getElementById('kkt-detail-chat-list')) return;

  window.__kktAnimationPlayed = true;
  window.__kktAnimToken = (window.__kktAnimToken || 0) + 1;
  const myToken = window.__kktAnimToken;
  const isAlive = () => (myToken === window.__kktAnimToken) && !!document.getElementById('kkt-detail-chat-list');

  // ★ 动画开始就禁用输入框，防止用户误触
  const inputEl = document.getElementById('kkt-chat-input');
  if (inputEl) inputEl.setAttribute('readonly', 'readonly');

  if (playJungFirstMessage) {
    // 场景 A：先播放"盯着你~"的打字气泡
    window.showKktTyping();
    setTimeout(() => {
      if (!isAlive()) return;
      window.hideKktTyping();
      window.appendKktJungMessage('盯着你~');
      const jung = FRIENDS.find(f => f.name === 'ㅈㅅㅊ');
      if (jung) {
        jung.msgs.push({ t: '盯着你~', me: false });
        sortFriendsByLastMessage();
      }
      setTimeout(() => {
        if (!isAlive()) return;
        window.triggerKktMyTurn();
      }, 800);
    }, 2000);
  } else {
    // 场景 B：消息已在聊天记录里，直接进入我方打字
    setTimeout(() => {
      if (!isAlive()) return;
      window.triggerKktMyTurn();
    }, 800);
  }
};

/* ---------- 记录应用打开 + 判断是否全部打开 ---------- */
window.__recordOpenedApp = function(id) {
  if (!id) return;
  if (!window.__openedApps) window.__openedApps = new Set();
  if (window.__openedApps.has(id)) return;
  window.__openedApps.add(id);
  window.__checkAllAppsOpened();
};

/* ---------- 判断是否所有应用都打开过（满足条件 → 解锁成灿来电） ---------- */
window.__checkAllAppsOpened = function() {
  // 已经满足过条件，直接返回（避免重复检查）
  if (window.__jungIncomingCallReady) return;
  if (!window.__openedApps || !window.__REQUIRED_APPS_FOR_JUNG_CALL) return;

  // 逐个检查 16 个必需应用是否都已点开过
  const allOpened = window.__REQUIRED_APPS_FOR_JUNG_CALL.every(appId =>
    window.__openedApps.has(appId)
  );
  if (!allOpened) return;

  // 全部打开过 → 打上"可以触发"标记
  // 具体什么时候弹出，交给 closeApp() 里那段逻辑去处理
  // （用户退出应用回到桌面时，会检测这个标记 → 触发成灿来电）
  window.__jungIncomingCallReady = true;
};

/* ---------- 轮询等待合适时机 ---------- */
window.__tryTriggerJungIncomingCall = function() {
  if (window.__jungIncomingCallPlayed) return;
  if (document.getElementById('jung-incoming-overlay')) return;

  // 还在锁屏 → 等
  const lock = document.getElementById('lockPage');
  if (lock && !lock.classList.contains('gone') && lock.style.display !== 'none') {
    setTimeout(window.__tryTriggerJungIncomingCall, 1500);
    return;
  }

  // 已经有别的来电 / 通话 / 键盘界面 → 等
  const busyIds = [
    'stranger-call-overlay',
    'ios-call-overlay',
    'ios-incoming-overlay',
    'ios-missed-overlay',
    'facetime-overlay',
    'kkt-call-overlay',
    'gomoku-overlay',
    'ko-ime-overlay',
    'kkt-ko-ime'
  ];
  for (let i = 0; i < busyIds.length; i++) {
    if (document.getElementById(busyIds[i])) {
      setTimeout(window.__tryTriggerJungIncomingCall, 1500);
      return;
    }
  }

  // KKT / iMessage 剧情还没播完 → 等
  if (window.__kktAwaitingMyFirstMessage ||
      window.__kktAwaitingFinalSend ||
      window.__kktAwaitingSecondMessage ||
      window.__koIME_pendingOkTyping ||
      window.__koIME_okTypingPending ||
      document.getElementById('kkt-typing-indicator') ||
      document.getElementById('kkt-story-banner')) {
    setTimeout(window.__tryTriggerJungIncomingCall, 1500);
    return;
  }

  // 有别的视频 / 音频正在播 → 等
  try {
    const mediaEls = document.querySelectorAll('video, audio');
    for (let i = 0; i < mediaEls.length; i++) {
      const el = mediaEls[i];
      if (el.id === 'music-audio-el') continue;
      if (!el.paused && !el.ended) {
        setTimeout(window.__tryTriggerJungIncomingCall, 1500);
        return;
      }
    }
  } catch (e) {}

  // 都 OK → 自动拨出电话
  window.__jungIncomingCallPlayed = true;
  window.showJungOutgoingCall();
};

      const m = String(Math.floor(seconds / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');

      try {

        callAudio.volume = window.MEDIA_VOLUME;
        callAudio.play().catch(() => {});

    }

      let lastIdx = -1;
      let endScheduled = false;
      subInterval = setInterval(() => {

        if (callAudio && !callAudio.paused && callAudio.currentTime > 0) {
          cur = callAudio.currentTime;
        }
        let active = null;
        for (let i = 0; i < subs.length; i++) {
          const start = i === 0 ? 0 : subs[i - 1].end;
          if (cur >= start && cur < subs[i].end) { active = subs[i]; break; }
        }
        if (active) {
          const idx = subs.indexOf(active);
          if (idx !== lastIdx) {
            lastIdx = idx;
            if (subText) subText.textContent = (active.speaker ? active.speaker + '：' : '') + active.text;
            if (subBox) { subBox.style.display = 'block'; subBox.style.opacity = '1'; }
          }
        }
        const lastEnd = subs[subs.length - 1].end || 0;
        if (cur >= lastEnd && !endScheduled) {
          endScheduled = true;
          if (subInterval) { clearInterval(subInterval); subInterval = null; }
          setTimeout(() => {
            if (overlay.isConnected) finishCall();
          }, 1500);
        }
      }, 200);

/* ---------- 锁屏「紧急」按钮专用：直接拨出成灿电话 ---------- */
window.triggerJungCallFromEmergency = function() {
  // ① 已经触发过（拨出已弹过/已挂断/已自动接通后关闭）→ 不再触发
  if (window.__jungIncomingCallPlayed) return;

  // ② 已经有一个拨出/来电界面在显示 → 不重复弹
  if (document.getElementById('jung-outgoing-overlay')) return;
  if (document.getElementById('jung-incoming-overlay')) return;

  // ③ 标记「已触发」：这样后面即使点完 16 个应用退出，
  //    closeApp() 里 !window.__jungIncomingCallPlayed 为 false → 不会再触发
  window.__jungIncomingCallPlayed = true;

  // ④ 标记「已排队」：防止 closeApp 里再挂一个 800ms 的定时器
  //    （双保险，其实③已经能拦住，但多设一个无副作用）
  window.__jungIncomingCallScheduled = true;

  // ⑤ 收起锁屏的数字键盘（点紧急时用户大概率还在密码输入界面）
  try {
    if (typeof window.hideLockKeypad === 'function') window.hideLockKeypad();
  } catch (e) {}

  // ⑥ 清理可能存在的轮询定时器（例如 closeApp 里挂的那个）
  //    （当前实现里没有暴露句柄，这一条是兜底：轮询进入下一轮时会因
  //     __jungIncomingCallPlayed 已为 true 而自动 return，无需专门清理）

  // ⑦ 直接调用拨出界面
  window.showJungOutgoingCall();
};
